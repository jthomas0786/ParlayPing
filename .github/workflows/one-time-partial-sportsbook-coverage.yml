          s=s.replace(old,new,1)

          s=s.replace("        open.innerHTML=`<span class=\"link-icon\">↗</span> <strong>Open <span id=\"selectedBookLabel\">${esc(selectedBook)}</span></strong> <span class=\"external-icon\">↗</span>`;", "        open.innerHTML=`<span class=\"link-icon\">↗</span> <strong>Open <span id=\"selectedBookLabel\">${esc(selectedBook)}</span> · ${coverage}/${total} lines available</strong> <span class=\"external-icon\">↗</span>`;",1)

          s=s.replace("  window.__PP_SPORTSBOOK_OPEN_TEST__={normalizeBook,sportsbookName,finiteOdds,safeHttps,fmtOdds,exactSportsbookLinks,pricedSportsbooks,orderedBooks,openTarget,legOddsForBook,altRowsForBook,mobileLike,resolverLeg,canResolveExact,applyResolvedSelections};\n  renderSportsbooks();\n  if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(()=>renderSportsbooks(selectedBook)));", "  window.__PP_SPORTSBOOK_OPEN_TEST__={normalizeBook,sportsbookName,finiteOdds,safeHttps,fmtOdds,exactSportsbookLinks,pricedSportsbooks,bookCoverage,orderedBooks,openTarget,legOddsForBook,altRowsForBook,mobileLike,resolverLeg,canResolveExact,applyResolvedSelections,resolveExactBook};\n  renderSportsbooks();\n  Promise.all([...RESOLVABLE_BOOKS].map(book=>bookCoverage(book)<legs.length?resolveExactBook(book):Promise.resolve(null))).finally(()=>renderSportsbooks(selectedBook));\n  if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(()=>renderSportsbooks(selectedBook)));",1)

          p.write_text(s)

          t=Path('tests/sportsbook-open-final.test.js')
          ts=t.read_text()
          add=r'''\n\ntest('sportsbooks remain visible with partial exact-line coverage',()=>{\n  const slip={legs:[\n    {bookOffers:{FanDuel:{oddsAmerican:-110},Bovada:{oddsAmerican:-115}}},\n    {bookOffers:{FanDuel:{oddsAmerican:-120}}},\n    {bookOffers:{Bovada:{oddsAmerican:-105}}}\n  ]};\n  const api=runOpenFinal(slip);\n  assert.equal(api.bookCoverage('FanDuel'),2);\n  assert.equal(api.bookCoverage('Bovada'),2);\n  assert.ok(api.orderedBooks().includes('FanDuel'));\n  assert.ok(api.orderedBooks().includes('Bovada'));\n});\n'''
          if 'sportsbooks remain visible with partial exact-line coverage' not in ts:
              t.write_text(ts+add)
          PY
      - name: Test
        run: npm test
      - name: Commit
        shell: bash
        run: |
          git config user.name 'parlayping-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add builder-sportsbook-open-final.js tests/sportsbook-open-final.test.js
          git commit -m 'Show partial sportsbook coverage for betslips'
          git push origin HEAD:main
