name: One-time partial sportsbook coverage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-partial-sportsbook-coverage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: npm ci
      - name: Patch partial sportsbook coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('builder-sportsbook-open-final.js')
          s=p.read_text()

          s=s.replace("    Fanatics:'https://sportsbook.fanatics.com/'\n  };", "    Fanatics:'https://sportsbook.fanatics.com/',\n    'Hard Rock Bet':'https://www.hardrock.bet/',\n    BetRivers:'https://www.betrivers.com/',\n    Pinnacle:'https://www.pinnacle.com/',\n    Bovada:'https://www.bovada.lv/sports',\n    Fliff:'https://www.getfliff.com/'\n  };")

          old="""    const books=[];
    for(const book of candidates){
      if(exactLinks[book]){books.push(book);continue;}
      if(legs.length&&legs.every(leg=>legOddsForBook(leg,book)!=null))books.push(book);
    }
    return books;
  }
  function orderedBooks(){
    const names=pricedSportsbooks();
    return [...BOOK_ORDER.filter(book=>names.includes(book)),...names.filter(book=>!BOOK_ORDER.includes(book)).sort()];
  }
"""
          new="""    return [...candidates].filter(book=>exactLinks[book]||bookCoverage(book)>0);
  }
  function bookCoverage(book){
    const normalized=sportsbookName(book);if(!normalized)return 0;
    return legs.reduce((count,leg)=>count+(legOddsForBook(leg,normalized)!=null?1:0),0);
  }
  function orderedBooks(){
    const names=pricedSportsbooks();
    const order=new Map(BOOK_ORDER.map((book,index)=>[book,index]));
    return names.sort((a,b)=>bookCoverage(b)-bookCoverage(a)||(order.get(a)??999)-(order.get(b)??999)||a.localeCompare(b));
  }
"""
          if old not in s: raise SystemExit('pricedSportsbooks block not found')
          s=s.replace(old,new,1)

          old="""  function applyResolvedSelections(book,data){
    const url=safeHttps(data?.url);if(!url)return null;
    slip.sportsbookLinks={...(slip.sportsbookLinks&&typeof slip.sportsbookLinks==='object'?slip.sportsbookLinks:{})};
    slip.sportsbookLinks[book]=url;
    if(Array.isArray(data?.selections))data.selections.forEach((selection,index)=>{
"""
          new="""  function applyResolvedSelections(book,data){
    const url=safeHttps(data?.url);
    if(data?.exact&&url){
      slip.sportsbookLinks={...(slip.sportsbookLinks&&typeof slip.sportsbookLinks==='object'?slip.sportsbookLinks:{})};
      slip.sportsbookLinks[book]=url;
    }
    if(Array.isArray(data?.selections))data.selections.forEach((selection,index)=>{
"""
          if old not in s: raise SystemExit('applyResolvedSelections head not found')
          s=s.replace(old,new,1)
          s=s.replace("    return url;\n  }\n\n  const resolving=new Map();", "    return {url:url||null,exact:Boolean(data?.exact&&url),coverage:bookCoverage(book)};\n  }\n\n  const resolving=new Map();",1)

          old="""      let data=null;try{data=await response.json();}catch{}
      if(!response.ok||!data?.ok||!data?.exact)return null;
      return applyResolvedSelections(normalized,data);
"""
          new="""      let data=null;try{data=await response.json();}catch{}
      if(!response.ok||!data?.ok)return null;
      return applyResolvedSelections(normalized,data);
"""
          if old not in s: raise SystemExit('resolver response block not found')
          s=s.replace(old,new,1)

          old="""      const exact=Boolean(exactLinks[book]);
      const resolvingNow=resolving.has(book);
      const canOpen=Boolean(openTarget(book));
      const detail=exact?'Prefilled Betslip':resolvingNow?'Preparing Betslip':canResolveExact(book)?'Tap to Prepare Betslip':canOpen?'Open Sportsbook':'Link Unavailable';
"""
          new="""      const exact=Boolean(exactLinks[book]);
      const resolvingNow=resolving.has(book);
      const canOpen=Boolean(openTarget(book));
      const coverage=bookCoverage(book),total=legs.length;
      const detail=exact&&coverage===total?`Prefilled · ${coverage}/${total} lines`:resolvingNow?`Checking · ${coverage}/${total} lines`:`${coverage}/${total} lines available`;
"""
          if old not in s: raise SystemExit('book detail block not found')
          s=s.replace(old,new,1)

          old="""      const target=selectedBook?openTarget(selectedBook):null;
      const resolvingNow=Boolean(selectedBook&&resolving.has(selectedBook));
      open.disabled=!target||resolvingNow;
"""
          new="""      const target=selectedBook?openTarget(selectedBook):null;
      const coverage=selectedBook?bookCoverage(selectedBook):0,total=legs.length;
      const resolvingNow=Boolean(selectedBook&&resolving.has(selectedBook));
      open.disabled=!target||resolvingNow||coverage===0;
