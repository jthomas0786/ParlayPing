name: One-time MLB production QA

on:
  push:
    paths:
      - '.github/workflows/one-time-mlb-production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production and verify MLB adapter
        shell: bash
        run: |
          set -euo pipefail
          payload='{"referenceTime":"2026-09-20T14:00:00Z","legs":[{"sport":"MLB","player":"Bryce Harper","team":"PHI","market":"hits","side":"over","line":1,"inclusive":true,"originalText":"Bryce Harper 1+ Hits"}]}'
          ok=0
          for attempt in $(seq 1 12); do
            echo "production probe attempt $attempt"
            if curl --silent --show-error --fail-with-body --location --post301 --post302 --post303 --max-time 20 \
              -X POST 'https://parlayping.net/api/analyze' \
              -H 'content-type: application/json' \
              --data "$payload" > /tmp/mlb.json; then
              cat /tmp/mlb.json
              if node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/mlb.json','utf8'));
          const r=(d.results||[])[0]||{};
          if(!d.ok) throw new Error('analysis not ok');
          if(!(d.sports||[]).includes('MLB')) throw new Error('MLB sport missing');
          if(!(d.supportedSports||[]).includes('MLB')) throw new Error('MLB adapter not supported');
          if(String(r.gameId)!=='823570') throw new Error(`wrong game ${r.gameId}`);
          if(r.player!=='Bryce Harper'||r.market!=='hits') throw new Error('wrong player/market');
          if(!['PENDING','LIVE','HIT','MISS'].includes(r.status)) throw new Error(`bad status ${r.status}`);
          if(r.status==='PENDING' && Math.abs(Number(r.probability)-0.6968)>0.0002) throw new Error(`wrong model probability ${r.probability}`);
          if(!String(d.source||'').includes('Sports Outpost MLB')) throw new Error('MLB model source missing');
          console.log('MLB production adapter verified:', {status:r.status, probability:r.probability, gameId:r.gameId});
          NODE
              then
                ok=1
                break
              fi
            fi
            sleep 8
          done
          test "$ok" -eq 1
