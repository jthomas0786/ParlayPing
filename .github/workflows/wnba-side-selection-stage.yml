name: WNBA Side Selection Stage

on:
  push:
    paths:
      - '.github/workflows/wnba-side-selection-stage.yml'

permissions:
  contents: write

jobs:
  patch-test:
    if: github.ref_name == 'wnba-gambly-parity-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch offer handoff and regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/basketball-adapter.js')
          s=p.read_text()
          old="""    const offer={
                oddsAmerican:american,
                selectionLink:candidate?.deepLink||candidate?.selectionLink||candidate?.link||null,
                betslipUrl:null,
                snapshotTime:candidate?.snapshotTime||null,
                priceKind:'verified-snapshot',
                line:finite(candidate?.line),
                side
              };
          """.replace('                ','      ')
          new="""    const selectionLink=side==='under'
                ?candidate?.underLink||candidate?.selectionLink||candidate?.deepLink||candidate?.link||null
                :candidate?.overLink||candidate?.selectionLink||candidate?.deepLink||candidate?.link||null;
              const selectionId=side==='under'
                ?candidate?.underSid||candidate?.selectionId||candidate?.sid||null
                :candidate?.overSid||candidate?.selectionId||candidate?.sid||null;
              const offer={
                oddsAmerican:american,
                selectionLink,
                selectionId:selectionId==null?null:String(selectionId),
                betslipUrl:candidate?.betslipUrl||null,
                snapshotTime:candidate?.snapshotTime||null,
                priceKind:candidate?.priceKind||(candidate?.preserved?'last-verified-pregame':'verified-snapshot'),
                line:finite(candidate?.line),
                side
              };
          """.replace('                ','      ')
          if old not in s: raise SystemExit('adapter anchor not found; refusing unsafe edit')
          p.write_text(s.replace(old,new,1))

          t=Path('tests/basketball-adapter.test.js')
          q=t.read_text()
          q=q.replace("const {analyzeBasketballSlip}=require('../lib/basketball-adapter');","const {analyzeBasketballSlip,exactBookOffers}=require('../lib/basketball-adapter');",1)
          anchor="test('basketball adapter returns safe unresolved instead of throwing when ESPN blocks live grading',async()=>{"
          insert="""test('basketball offers preserve the exact side-specific sportsbook link and selection id',()=>{
            const row={eventId:'evt-side',sport:'WNBA',commenceTime:'2026-09-24T00:00:00.000Z',player:'Test Player',market:'points',line:10.5,book:'DraftKings',overPrice:-105,underPrice:-115,overLink:'https://sportsbook.draftkings.com/over',underLink:'https://sportsbook.draftkings.com/under',overSid:'over-123',underSid:'under-456',snapshotTime:'2026-09-23T23:00:00.000Z'};
            const odds={rows:[row]};
            const over=exactBookOffers(odds,{sport:'WNBA',player:'Test Player',market:'points',side:'over',line:10.5},row).bookOffers.DraftKings;
            const under=exactBookOffers(odds,{sport:'WNBA',player:'Test Player',market:'points',side:'under',line:10.5},row).bookOffers.DraftKings;
            assert.equal(over.selectionLink,'https://sportsbook.draftkings.com/over');
            assert.equal(over.selectionId,'over-123');
            assert.equal(over.oddsAmerican,-105);
            assert.equal(under.selectionLink,'https://sportsbook.draftkings.com/under');
            assert.equal(under.selectionId,'under-456');
            assert.equal(under.oddsAmerican,-115);
          });

          """
          if anchor not in q: raise SystemExit('test anchor not found; refusing unsafe edit')
          t.write_text(q.replace(anchor,insert+anchor,1))
          PY
      - run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test
      - name: Commit tested staging changes and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wnba-side-selection-stage.yml
          git add lib/basketball-adapter.js tests/basketball-adapter.test.js
          git commit -m 'Preserve side-specific WNBA sportsbook selections'
          git pull --rebase origin wnba-gambly-parity-stage
          git push origin HEAD:wnba-gambly-parity-stage
