name: Share Card Preview

on:
  push:
    branches: [x-share-card-brand-stage]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Render share card previews
        run: node scripts/share-card-preview.mjs
      - name: Upload share card previews
        uses: actions/upload-artifact@v4
        with:
          name: share-card-preview
          path: artifacts/share-card-preview-*.png
          if-no-files-found: error
