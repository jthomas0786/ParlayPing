name: ParlayPing.net Render Domain Cutover QA
on:
  push:
    branches:
      - qa/render-domain-cutover-smoke-20261011
    paths:
      - '.github/workflows/parlayping-render-domain-cutover-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify both domains and Render backend
        shell: bash
        run: |
          set -euo pipefail
          base="https://parlayping.net"
          printf 'Checking public site: %s\n' "$base"
          curl --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 35 -fsSL -D /tmp/pp-root-headers "$base/" -o /tmp/pp-root.html
          grep -Eiq 'ParlayPing|Parlay Ping' /tmp/pp-root.html || { echo 'Wrong homepage served'; exit 1; }
          echo 'Root homepage: PASS'
          curl --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 35 -fsSL "$base/healthz" -o /tmp/pp-health.json
          node -e 'const j=require("/tmp/pp-health.json");if(j.runtime!=="render-node")throw Error("Custom domain is not serving the Render Node backend");console.log("Custom domain serves Render Node: PASS")'
          curl --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 35 -fsSL "$base/submit" -o /tmp/pp-submit.html
          grep -Fq 'id="verifyButton"' /tmp/pp-submit.html || { echo 'Standalone upload form missing'; exit 1; }
          echo 'Standalone screenshot upload route: PASS'
          curl --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 35 -fsSL "$base/api/status" -o /tmp/pp-status.json
          node -e 'const j=require("/tmp/pp-status.json");if(!j.ok||j.service!=="ParlayPing"||!j.engine?.ready)throw Error("Parlay Ping API status failed");console.log("API status: PASS; X OAuth configured="+!!j.x?.configured+"; automatic posting enabled="+!!j.x?.autoReplyEnabled+"; vision="+!!j.parser?.visionConfigured+"; Stripe="+!!j.integrations?.stripeConfigured+"; Supabase="+!!j.developerApi?.supabaseConfigured+"; shareSecret="+!!j.developerApi?.shareSecretConfigured+"; oddsProvider="+!!j.integrations?.oddsConfigured)'
          node - <<'NODE'
          const status=require('/tmp/pp-status.json');
          if(status.x?.configured!==true)throw Error('Missing one or more @ParlayPing OAuth 1.0 keys in Render.');
          if(status.x?.autoReplyEnabled!==false || status.x?.postingReady!==false)throw Error('Automatic X posting must remain OFF during connection verification.');
          console.log('X OAuth 1.0 environment keys: PRESENT (all four); automatic posting: OFF');
          if(status.x?.workerProtected!==true)throw Error('Protected X worker token has not been configured on Render.');
          console.log('Protected X worker: CONFIGURED; posting remains disabled')
          NODE
          code="$(curl --retry 2 --connect-timeout 10 --max-time 35 -sSL -o /tmp/pp-unauth.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"legs":[]}' "$base/api/v1/analyze")"
          case "$code" in 401|403) echo "Commercial developer API denies unauthenticated requests: PASS ($code)" ;; *) echo "Unsafe API response to unauthenticated visitor: $code"; exit 1;; esac
          code="$(curl --retry 2 --connect-timeout 10 --max-time 35 -sSL -o /tmp/pp-empty.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$base/api/landing-create")"
          if [ "$code" != 400 ]; then echo "Standalone betslip creation endpoint unexpected response: $code"; exit 1; fi
          echo 'Standalone betslip creation endpoint accepts route and validates input: PASS'
          printf 'Checking www redirect: '
          target="$(curl --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 35 -sSL -o /dev/null -w '%{url_effective}:%{http_code}' 'https://www.parlayping.net/')"
          echo "$target"
          case "$target" in https://parlayping.net/*:200) echo 'www redirect and certificate: PASS';; *) echo 'www domain not redirecting to working root';exit 1;;esac
          # New subscription billing remains a restricted sandbox preview; public callers cannot start Checkout.
          curl --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 35 -fsSL "$base/profile" -o /tmp/pp-profile.html
          grep -Fq 'devUpgradeStarter' /tmp/pp-profile.html
          grep -Fq 'Starter · $20/mo' /tmp/pp-profile.html
          grep -Fq 'Pro · $70/mo' /tmp/pp-profile.html
          grep -Fq 'Business · $120/mo' /tmp/pp-profile.html
          curl --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 35 -fsSL "$base/profile-dev.js" -o /tmp/pp-profile-dev.js
          grep -Fq "checkout('starter')" /tmp/pp-profile-dev.js
          code="$(curl --connect-timeout 10 --max-time 35 -sSL -o /tmp/pp-billing-checkout-anon.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"plan":"starter"}' "$base/api/billing-checkout")"
          if [ "$code" != 401 ]; then echo "Billing checkout authentication gate failed ($code)";exit 1;fi
          echo 'Three-tier sandbox billing UI and unauthenticated checkout denial: PASS'
          # Customer Developer API onboarding — public pricing, dashboard and auth gates.
          curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 35 -fsSL "$base/developers" -o /tmp/pp-developers.html
          for plan in starter pro business; do
            grep -Fq "data-api-plan=\"$plan\"" /tmp/pp-developers.html
          done
          for amount in '$20' '$70' '$120'; do
            grep -Fq "$amount" /tmp/pp-developers.html
          done
          grep -Fq 'Public paid checkout is not open yet' /tmp/pp-developers.html
          curl --retry 2 --connect-timeout 10 --max-time 35 -fsSL "$base/developers.css" -o /tmp/pp-developers.css
          curl --retry 2 --connect-timeout 10 --max-time 35 -fsSL "$base/developers.js" -o /tmp/pp-developers.js
          grep -Fq 'account.searchParams.set' /tmp/pp-developers.js
          curl --retry 2 --connect-timeout 10 --max-time 35 -fsSL "$base/profile-dev.js" -o /tmp/pp-profile-dev-new.js
          grep -Fq 'sandboxCheckoutAllowed' /tmp/pp-profile-dev-new.js
          grep -Fq 'devUpgradeStarter' /tmp/pp-profile-dev-new.js
          curl --retry 2 --connect-timeout 10 --max-time 35 -fsSL "$base/tso2-shell.js" -o /tmp/pp-tso2-shell-new.js
          grep -Fq "'DEVELOPER API','/developers'" /tmp/pp-tso2-shell-new.js
          curl --retry 2 --connect-timeout 10 --max-time 35 -fsSL "$base/api/plans" -o /tmp/pp-dev-plans.json
          node - <<'NODE'
          const f=require('fs');
          const d=JSON.parse(f.readFileSync('/tmp/pp-dev-plans.json','utf8'));
          if(!d.ok||!Array.isArray(d.plans))throw Error('Developer plan list missing');
          const expected={starter:[2000,5000],pro:[7000,20000],business:[12000,50000]};
          if(d.plans.length!==3)throw Error('Plan list must have exactly three public paid tiers');
          for(const p of d.plans){const e=expected[p.id];if(!e||p.price_monthly_cents!==e[0]||p.monthly_request_limit!==e[1])throw Error('Incorrect approved plan pricing or allowance: '+p.id)}
          console.log('Three paid plans and exact dollar amounts: PASS');
          NODE
          code="$(curl --connect-timeout 10 --max-time 35 -sSL -o /tmp/pp-dev-account-unauth.json -w '%{http_code}' "$base/api/account")"
          [ "$code" = 401 ] || { echo "Unauthenticated developer account endpoint not denied: $code"; exit 1; }
          code="$(curl --connect-timeout 10 --max-time 35 -sSL -o /tmp/pp-dev-keys-unauth.json -w '%{http_code}' "$base/api/api-keys")"
          [ "$code" = 401 ] || { echo "Unauthenticated API keys endpoint not denied: $code"; exit 1; }
          code="$(curl --connect-timeout 10 --max-time 35 -sSL -o /tmp/pp-dev-checkout-unauth.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"plan":"pro"}' "$base/api/billing-checkout")"
          [ "$code" = 401 ] || { echo "Unauthenticated developer checkout not denied: $code"; exit 1; }
          echo 'Public Developer API landing, plans, tool nav and private authentication boundaries: VERIFIED'
          echo 'ParlayPing.net HTTPS, standalone frontend, Render backend, upload, developer API and www redirect: VERIFIED'
