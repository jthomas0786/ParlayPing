name: WNBA Production Candidate Final QA

on:
  push:
    branches: [wnba-parity-production-ready-stage]
    paths:
      - '.github/workflows/wnba-prod-candidate-final-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPORTS_OUTPOST_RAW_BASE: https://raw.githubusercontent.com/jthomas0786/The-Sports-Outpost/wnba-parity-prod-ready-stage/slates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full regression suite
        run: npm test
      - name: Verify six-leg WNBA sportsbook parity against production candidate feed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const {analyzeBasketballSlip}=require('./lib/basketball-adapter');
          (async()=>{
            const referenceTime='2026-09-23T23:59:00.000Z';
            const legs=[
              {id:'canada',sport:'WNBA',player:'Jordin Canada',market:'assists',side:'over',line:6,inclusive:true,oddsAmerican:777,sportsbook:'FanDuel'},
              {id:'gray',sport:'WNBA',player:'Allisha Gray',market:'points',side:'over',line:15,inclusive:true,oddsAmerican:777,sportsbook:'FanDuel'},
              {id:'reese',sport:'WNBA',player:'Angel Reese',market:'rebsAsts',side:'over',line:12,inclusive:true,oddsAmerican:110,sportsbook:'FanDuel'},
              {id:'astier',sport:'WNBA',player:'Pauline Astier',market:'ptsRebs',side:'over',line:10,inclusive:true,oddsAmerican:120,sportsbook:'FanDuel'},
              {id:'stewart',sport:'WNBA',player:'Breanna Stewart',market:'pra',side:'over',line:30,inclusive:true,oddsAmerican:125,sportsbook:'FanDuel'},
              {id:'jones',sport:'WNBA',player:'Jonquel Jones',market:'points',side:'over',line:10,inclusive:true,oddsAmerican:777,sportsbook:'FanDuel'}
            ];
            const result=await analyzeBasketballSlip('WNBA',legs,{referenceTime});
            assert.equal(result.results.length,6);
            const byId=Object.fromEntries(result.results.map(r=>[r.id,r]));
            for(const id of ['canada','gray','reese','astier','stewart','jones']){
              assert.ok(byId[id],`missing ${id}`);
              assert.equal(byId[id].status,'PENDING',`${id} should resolve pregame`);
              assert.ok(byId[id].gameId,`${id} should have verified game identity`);
            }
            for(const id of ['canada','gray','jones']){
              const row=byId[id];
              assert.notEqual(row.oddsAmerican,777,`${id} must use exact provider price`);
              assert.notEqual(row.oddsPriceKind,'explicit-slip',`${id} must use provider quote`);
              assert.ok(/^sportsbook-(?:devig|implied)-median$/.test(String(row.probabilityMethod)),`${id} must use provider-derived probability`);
              assert.ok(Object.keys(row.bookOffers||{}).length>=1,`${id} should expose sportsbook offers`);
              for(const offer of Object.values(row.bookOffers||{}))assert.ok(Number.isFinite(Number(offer.oddsAmerican)),`${id} offer must have exact price`);
            }
            for(const [id,price] of Object.entries({reese:110,astier:120,stewart:125})){
              const row=byId[id];
              assert.equal(row.oddsAmerican,price,`${id} exact slip price should fill provider gap`);
              assert.equal(row.oddsPriceKind,'explicit-slip',`${id} must be explicit-slip`);
              assert.equal(row.probabilityMethod,'sportsbook-slip-implied',`${id} must be slip-implied`);
              assert.deepEqual(Object.keys(row.bookOffers||{}),['FanDuel'],`${id} must not receive nearby provider prices`);
            }
            const ui=fs.readFileSync('builder-summary-odds-hotfix.js','utf8');
            assert.match(ui,/BOOK_HOME/);
            assert.match(ui,/Exact slip when available; sportsbook page otherwise/);
            assert.match(ui,/window\.open\(url,'_blank','noopener,noreferrer'\)/);
            assert.match(ui,/offerFor/);
            assert.match(ui,/priceFor/);
            console.log(JSON.stringify(result.results.map(r=>({id:r.id,oddsAmerican:r.oddsAmerican,sportsbook:r.sportsbook,oddsPriceKind:r.oddsPriceKind,books:Object.keys(r.bookOffers||{})})),null,2));
            console.log('Final WNBA production-candidate QA passed.');
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
