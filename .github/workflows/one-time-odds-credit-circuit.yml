name: One-time Odds API credit circuit breaker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-odds-credit-circuit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch provider cooldown and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('server/api/lib/odds-api-deeplink.js')
          text=p.read_text()
          old="""const oddsInflight=new Map();\n\nconst SPORT_KEYS={"""
          new="""const oddsInflight=new Map();\nconst ODDS_CREDIT_COOLDOWN_MS=5*60_000;\nlet oddsProviderCooldownUntil=0;\n\nconst SPORT_KEYS={"""
          if old not in text: raise SystemExit('provider cache anchor not found')
          text=text.replace(old,new,1)

          old="""async function fetchJson(url,{fetchImpl=fetch,timeoutMs=6500}={}){\n  const response=await fetchImpl(url,{headers:{accept:'application/json','user-agent':'ParlayPing/1.4'},cache:'no-store',signal:AbortSignal.timeout(timeoutMs)});\n  let data=null;try{data=await response.json();}catch{}\n  if(!response.ok){const error=new Error(data?.message||data?.error||`The Odds API returned ${response.status}.`);error.status=response.status;error.data=data;throw error;}\n  return{data,response};\n}"""
          new="""function oddsCreditCooldownError(){\n  const error=new Error('Odds provider usage credits are temporarily exhausted.');\n  error.status=401;\n  error.data={error_code:'OUT_OF_USAGE_CREDITS',message:error.message,cached:true,retryAfterMs:Math.max(0,oddsProviderCooldownUntil-Date.now())};\n  return error;\n}\nasync function fetchJson(url,{fetchImpl=fetch,timeoutMs=6500}={}){\n  if(Date.now()<oddsProviderCooldownUntil)throw oddsCreditCooldownError();\n  const response=await fetchImpl(url,{headers:{accept:'application/json','user-agent':'ParlayPing/1.4'},cache:'no-store',signal:AbortSignal.timeout(timeoutMs)});\n  let data=null;try{data=await response.json();}catch{}\n  if(!response.ok){\n    if(data?.error_code==='OUT_OF_USAGE_CREDITS')oddsProviderCooldownUntil=Date.now()+ODDS_CREDIT_COOLDOWN_MS;\n    const error=new Error(data?.message||data?.error||`The Odds API returned ${response.status}.`);error.status=response.status;error.data=data;throw error;\n  }\n  return{data,response};\n}"""
          if old not in text: raise SystemExit('fetchJson anchor not found')
          text=text.replace(old,new,1)

          old="""function clearOddsApiCaches(){eventCache.clear();oddsCache.clear();eventInflight.clear();oddsInflight.clear();}"""
          new="""function clearOddsApiCaches(){eventCache.clear();oddsCache.clear();eventInflight.clear();oddsInflight.clear();oddsProviderCooldownUntil=0;}"""
          if old not in text: raise SystemExit('clear cache anchor not found')
          text=text.replace(old,new,1)
          p.write_text(text)

          p=Path('tests/odds-api-deeplink.test.js')
          text=p.read_text()
          marker="suppresses repeated provider calls while usage credits are exhausted"
          if marker not in text:
              text += r'''\n\ntest('suppresses repeated provider calls while usage credits are exhausted',async()=>{\n  clearOddsApiCaches();\n  let calls=0;\n  const fetchImpl=async()=>{\n    calls+=1;\n    return {\n      ok:false,\n      status:401,\n      json:async()=>({error_code:'OUT_OF_USAGE_CREDITS',message:'Usage credits have been exhausted'}),\n      headers:{get:()=>null}\n    };\n  };\n  await assert.rejects(\n    getEventOddsForBooks({sport:'NFL',eventId:'quota-1',books:['FanDuel','BetMGM'],markets:['player_pass_yds'],apiKey:'test-key',fetchImpl}),\n    error=>error?.data?.error_code==='OUT_OF_USAGE_CREDITS'\n  );\n  await assert.rejects(\n    getEventOddsForBooks({sport:'NFL',eventId:'quota-2',books:['FanDuel','BetMGM'],markets:['player_pass_yds'],apiKey:'test-key',fetchImpl}),\n    error=>error?.data?.error_code==='OUT_OF_USAGE_CREDITS'&&error?.data?.cached===true\n  );\n  assert.equal(calls,1);\n  clearOddsApiCaches();\n});\n'''
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-odds-credit-circuit.yml
          git config user.name "jthomas0786"
          git config user.email "jthomas0786@gmail.com"
          git add server/api/lib/odds-api-deeplink.js tests/odds-api-deeplink.test.js
          git add -u .github/workflows/one-time-odds-credit-circuit.yml
          git commit -m "Circuit-break exhausted Odds API usage credits"
          git push origin main
