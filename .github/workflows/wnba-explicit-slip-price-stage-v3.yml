name: WNBA Explicit Slip Price Stage v3

on:
  push:
    paths:
      - '.github/workflows/wnba-explicit-slip-price-stage-v3.yml'

permissions:
  contents: write

jobs:
  patch-test:
    if: github.ref_name == 'wnba-parity-final-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse validated patcher with safe JavaScript wording
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/wnba-explicit-slip-price-stage-v2.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(source) if "python - <<'PY'" in line)+1
          end=next(i for i in range(start,len(source)) if source[i].strip()=='PY')
          rows=source[start:end]
          indent=min(len(line)-len(line.lstrip()) for line in rows if line.strip())
          script='\n'.join(line[indent:] for line in rows)+'\n'
          script=script.replace("a nearby selection's price as a leg price","a nearby selection price as a leg price")
          Path('/tmp/wnba_patch.py').write_text(script)
          PY
          python /tmp/wnba_patch.py
          node --check server/api/lib/slip-parser.js
          node --check server/api/lib/sport-router.js
          node --check lib/basketball-adapter.js
      - run: npm install --no-audit --no-fund
      - name: Run complete regression suite
        run: npm test
      - name: Commit tested changes and remove one-time workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wnba-explicit-slip-price-stage.yml .github/workflows/wnba-explicit-slip-price-stage-v2.yml .github/workflows/wnba-explicit-slip-price-stage-v3.yml
          git add server/api/lib/slip-parser.js server/api/lib/sport-router.js lib/basketball-adapter.js tests/wnba-explicit-slip-price.test.js
          git commit -m 'Preserve exact slip-bound WNBA prices'
          git pull --rebase origin wnba-parity-final-stage
          git push origin HEAD:wnba-parity-final-stage
