name: Headshot Fallback Stage QA

on:
  push:
    branches: [headshot-fallback-stage]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify headshot fallback regression contract
        run: node --test tests/headshot-fallback.test.js
      - name: Run full regression suite
        run: npm test
      - name: Verify live ESPN share headshot resolution
        run: node scripts/share-assets-live-smoke.mjs
      - name: Render production-path share card
        run: node scripts/share-card-preview.mjs
      - name: Upload rendered share cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headshot-fallback-stage-qa
          path: artifacts/share-card-preview-*.png
          if-no-files-found: ignore
          retention-days: 3
