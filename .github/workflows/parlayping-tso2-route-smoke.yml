name: Parlay Ping × TSO 2.0 Public Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parlayping-tso2-route-smoke.yml'
      - 'tso2-shell.js'
      - 'tso2-shell.css'
      - 'render-server.js'
      - 'app-nav.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm Render is healthy on TSO subdomain
        shell: bash
        run: |
          set -euo pipefail
          base="https://parlayping.thesportsoutpost.com"
          function check() {
            local route="$1" type="$2" file
            file="$(mktemp)"
            local http
            http="$(curl --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 35 -sS -L -o "$file" -w '%{http_code}' "$base$route")"
            echo "$route : HTTP $http ($type)"
            test "$http" = 200
            case "$type" in
              json) node -e 'const fs=require("fs"),o=JSON.parse(fs.readFileSync(process.argv[1]));if(!o.ok||o.runtime!=="render-node")throw Error("Wrong backend or missing Render health")' "$file";;
              html) grep -Fq 'tso2-shell.js?v=20261010a' "$file";;
              js) grep -Fq "TSO2_PARLAYPING_SHELL" "$file";;
              css) grep -Fq "tso2pp-sidebar" "$file";;
            esac
            rm "$file"
          }
          check /healthz json
          check / html
          check /account.html html
          check /profile html
          check /submit html
          check /tso2-shell.js js
          check /tso2-shell.css css
          # A public visitor cannot call metered partner APIs without a private key.
          for endpoint in /api/v1/analyze /api/v1/build; do
            code="$(curl --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 25 -sS -o /tmp/tso-pp-unauth.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"legs":[]}' "$base$endpoint")"
            echo "$endpoint without API key: HTTP $code"
            case "$code" in 401|403) :;; *) echo "Unexpected API auth response"; exit 1;; esac
          done
          html="$(curl --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 35 -fsSL https://thesportsoutpost.com/)"
          echo "$html" | grep -Fq 'PARLAY PING'
          echo 'TSO 2.0 branded Parlay Ping routes, developer authentication and live navigation: PASS'
