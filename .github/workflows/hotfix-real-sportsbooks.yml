name: Hotfix real sportsbook matching

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-real-sportsbooks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply sportsbook hotfix
        run: node scripts/apply-real-sportsbook-hotfix.mjs
      - name: Run targeted sportsbook tests
        run: node --test tests/sportsbook-open-final.test.js tests/sportsbook-inclusive-threshold.test.js
      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "parlayping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add builder-sportsbook-open-final.js server/api/lib/sportsbook-enrich.js server/api/builder-page.js tests/sportsbook-open-final.test.js tests/sportsbook-inclusive-threshold.test.js
          git commit -m "Fix real sportsbook matching for plus thresholds"
          git push origin HEAD:main
