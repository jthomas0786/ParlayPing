name: Expand exact sportsbook resolution to BetMGM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-betmgm-exact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch BetMGM exact resolution and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
              p.write_text(text.replace(old,new,1))
          replace('server/api/lib/odds-api-deeplink.js', "const BOOK_KEYS={FanDuel:'fanduel',DraftKings:'draftkings'};", "const BOOK_KEYS={FanDuel:'fanduel',DraftKings:'draftkings',BetMGM:'betmgm'};")
          replace('server/api/lib/odds-api-deeplink.js', "const normalizedBook=normBook(book);if(!BOOK_KEYS[normalizedBook])throw new Error('Exact deeplink enrichment currently supports FanDuel and DraftKings.');", "const normalizedBook=normBook(book);if(!BOOK_KEYS[normalizedBook])throw new Error('Exact sportsbook enrichment is not available for this book.');")
          replace('server/api/lib/exact-sportsbook-enrich.js', "const books = Array.isArray(options.books) && options.books.length ? options.books : ['FanDuel', 'DraftKings'];", "const books = Array.isArray(options.books) && options.books.length ? options.books : ['FanDuel', 'DraftKings', 'BetMGM'];")
          replace('server/api/builder-page.js', "const sportsbookSlip = await enrichMissingExactSportsbooks(pricedSlip, { books:['FanDuel','DraftKings'] });", "const sportsbookSlip = await enrichMissingExactSportsbooks(pricedSlip, { books:['FanDuel','DraftKings','BetMGM'] });")
          replace('tests/odds-api-deeplink.test.js', "  sportKey,\n  marketCandidates,", "  sportKey,\n  bookKey,\n  marketCandidates,")
          replace('tests/odds-api-deeplink.test.js', "  assert.equal(sportKey('WNBA'),'basketball_wnba');", "  assert.equal(sportKey('WNBA'),'basketball_wnba');\n  assert.equal(bookKey('FanDuel'),'fanduel');\n  assert.equal(bookKey('DraftKings'),'draftkings');\n  assert.equal(bookKey('BetMGM'),'betmgm');")
          replace('tests/exact-sportsbook-enrich.test.js', "test('missing coverage is proactively checked for both FanDuel and DraftKings',async()=>{", "test('missing coverage is proactively checked for FanDuel DraftKings and BetMGM',async()=>{")
          replace('tests/exact-sportsbook-enrich.test.js', "  assert.deepEqual(calls,['FanDuel','DraftKings']);\n  assert.equal(hasFullBookPricing(out,'FanDuel'),true);\n  assert.equal(hasFullBookPricing(out,'DraftKings'),true);", "  assert.deepEqual(calls,['FanDuel','DraftKings','BetMGM']);\n  assert.equal(hasFullBookPricing(out,'FanDuel'),true);\n  assert.equal(hasFullBookPricing(out,'DraftKings'),true);\n  assert.equal(hasFullBookPricing(out,'BetMGM'),true);")
          p=Path('tests/exact-sportsbook-enrich.test.js'); text=p.read_text()
          marker="\ntest('incomplete or wrong-line resolution never fabricates sportsbook coverage'"
          lines=["", "test('BetMGM full exact coverage preserves verified per-leg links without inventing a combined betslip',async()=>{", "  const slip={legs:[", "    {sport:'NFL',player:'Jalen Hurts',market:'passYds',side:'over',line:175,inclusive:true,bookOffers:{}},", "    {sport:'NFL',player:'Saquon Barkley',market:'rushYds',side:'over',line:40,inclusive:true,bookOffers:{}}", "  ]};", "  const out=await enrichMissingExactSportsbooks(slip,{books:['BetMGM'],log:false,resolve:async()=>({", "    exact:false,url:null,selections:[", "      {price:-330,line:174.5,marketKey:'player_pass_yds_alternate',selectionId:'mgm-1',selectionLink:'https://sports.betmgm.com/en/sports/add-to-betslip/one'},", "      {price:-750,line:39.5,marketKey:'player_rush_yds_alternate',selectionId:'mgm-2',selectionLink:'https://sports.betmgm.com/en/sports/add-to-betslip/two'}", "    ]", "  })});", "  assert.equal(hasFullBookPricing(out,'BetMGM'),true);", "  assert.equal(out.legs[0].bookOffers.BetMGM.oddsAmerican,-330);", "  assert.equal(out.legs[0].bookOffers.BetMGM.selectionId,'mgm-1');", "  assert.equal(out.legs[1].bookOffers.BetMGM.selectionLink,'https://sports.betmgm.com/en/sports/add-to-betslip/two');", "  assert.equal(out.sportsbookLinks?.BetMGM,undefined);", "});", ""]
          addition='\n'.join(lines)
          if marker not in text: raise SystemExit('Insertion marker missing in exact sportsbook tests')
          p.write_text(text.replace(marker, addition+marker, 1))
          PY
          npm install --no-audit --no-fund
          npm test
          git config user.name "jthomas0786"
          git config user.email "jthomas0786@gmail.com"
          git add server/api/lib/odds-api-deeplink.js server/api/lib/exact-sportsbook-enrich.js server/api/builder-page.js tests/odds-api-deeplink.test.js tests/exact-sportsbook-enrich.test.js
          git commit -m "Resolve exact BetMGM selections in Builder"
          git push origin HEAD:main
