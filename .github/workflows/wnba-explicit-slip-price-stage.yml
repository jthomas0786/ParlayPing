name: WNBA Explicit Slip Price Stage

on:
  push:
    paths:
      - '.github/workflows/wnba-explicit-slip-price-stage.yml'

permissions:
  contents: write

jobs:
  patch-test:
    if: github.ref_name == 'wnba-parity-final-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve exact slip-bound sportsbook prices through WNBA analysis
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Vision parser: keep only explicit per-selection American odds + sportsbook identity.
          p=Path('server/api/lib/slip-parser.js')
          s=p.read_text()
          old="""  const line = raw.line == null ? null : Number(raw.line);
            if (!binary && !Number.isFinite(line)) return null;
            if (Number.isFinite(line) && (line < 0 || line > 100000)) return null;
            return {
          """.replace('            ','  ')
          new="""  const line = raw.line == null ? null : Number(raw.line);
            if (!binary && !Number.isFinite(line)) return null;
            if (Number.isFinite(line) && (line < 0 || line > 100000)) return null;
            const rawOdds = raw.oddsAmerican == null ? null : Number(raw.oddsAmerican);
            const oddsAmerican = Number.isFinite(rawOdds) && rawOdds !== 0 && Math.abs(rawOdds) >= 100 && Math.abs(rawOdds) <= 100000 ? Math.round(rawOdds) : null;
            const sportsbook = raw.sportsbook ? String(raw.sportsbook).trim().slice(0, 80) : null;
            return {
          """.replace('            ','  ')
          if old not in s: raise SystemExit('sanitizeLeg anchor not found')
          s=s.replace(old,new,1)
          old="""    inclusive: binary ? true : Boolean(raw.inclusive),
                originalText: String(raw.originalText || '').trim().slice(0, 240)
              };
          """.replace('                ','    ')
          new="""    inclusive: binary ? true : Boolean(raw.inclusive),
                originalText: String(raw.originalText || '').trim().slice(0, 240),
                oddsAmerican,
                sportsbook
              };
          """.replace('                ','    ')
          if old not in s: raise SystemExit('sanitizeLeg return anchor not found')
          s=s.replace(old,new,1)
          old="Treat each visible wager selection as one leg. Ignore odds, stake, payout, boosts, sportsbook branding, game totals, spreads, unrelated team/game moneylines, settled icons, cash-out text, and promotional copy. Tennis/Table Tennis explicit player match-winner selections and MMA fighter-winner selections are valid legs and should not be discarded as generic moneylines."
          new="Treat each visible wager selection as one leg. Preserve a leg-level American price only when that price is visibly bound to that exact selection. Preserve the sportsbook name only when the screenshot clearly identifies the book containing that selection. Never use overall parlay odds, stake, payout, boost value, or a nearby selection's price as a leg price. Ignore unrelated game totals, spreads, team/game moneylines, settled icons, cash-out text, and promotional copy. Tennis/Table Tennis explicit player match-winner selections and MMA fighter-winner selections are valid legs and should not be discarded as generic moneylines."
          if old not in s: raise SystemExit('vision instruction anchor not found')
          s=s.replace(old,new,1)
          old="""        side:{type:'string',enum:['over','under','yes','no']}, line:{type:['number','null']}, inclusive:{type:'boolean'}, originalText:{type:'string'}
              },
              required:['sport','player','team','market','side','line','inclusive','originalText']
          """.replace('              ','        ')
          new="""        side:{type:'string',enum:['over','under','yes','no']}, line:{type:['number','null']}, inclusive:{type:'boolean'}, originalText:{type:'string'},
                oddsAmerican:{type:['integer','null']}, sportsbook:{type:['string','null']}
              },
              required:['sport','player','team','market','side','line','inclusive','originalText','oddsAmerican','sportsbook']
          """.replace('              ','        ')
          if old not in s: raise SystemExit('vision schema anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Multi-sport normalization: do not throw away exact slip quote metadata.
          p=Path('server/api/lib/sport-router.js')
          s=p.read_text()
          old="""function normalizeUniversalLeg(input,index){
            const sport=normalizeSport(input?.sport);
            if(sport==='NFL') return normalizeLeg({...input,sport:'NFL'},index);
            return {
          """.replace('            ','  ')
          new="""function explicitQuoteFields(input){
            const rawOdds=input?.oddsAmerican==null?null:Number(input.oddsAmerican);
            return {
              oddsAmerican:Number.isFinite(rawOdds)&&rawOdds!==0&&Math.abs(rawOdds)>=100&&Math.abs(rawOdds)<=100000?Math.round(rawOdds):null,
              sportsbook:input?.sportsbook?String(input.sportsbook).trim().slice(0,80):null
            };
          }
          function normalizeUniversalLeg(input,index){
            const sport=normalizeSport(input?.sport);
            const quote=explicitQuoteFields(input);
            if(sport==='NFL') return {...normalizeLeg({...input,sport:'NFL'},index),...quote};
            return {
          """.replace('            ','  ')
          if old not in s: raise SystemExit('router normalize anchor not found')
          s=s.replace(old,new,1)
          old="""    inclusive:Boolean(input?.inclusive),
                originalText:input?.originalText||null
              };
          """.replace('                ','    ')
          new="""    inclusive:Boolean(input?.inclusive),
                originalText:input?.originalText||null,
                ...quote
              };
          """.replace('                ','    ')
          if old not in s: raise SystemExit('router quote return anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 3) Basketball adapter: use exact snapshot quotes first, explicit slip price only as an exact fallback.
          p=Path('lib/basketball-adapter.js')
          s=p.read_text()
          s=s.replace("draftkings:'DraftKings',dk:'DraftKings',fanduel:'FanDuel',fd:'FanDuel'","draftkings:'DraftKings',draftkingssportsbook:'DraftKings',dk:'DraftKings',fanduel:'FanDuel',fanduelsportsbook:'FanDuel',fd:'FanDuel'",1)
          s=s.replace("fanatics:'Fanatics',fanaticssportsbook:'Fanatics',hardrock:'Hard Rock'","fanatics:'Fanatics',fanaticssportsbook:'Fanatics',espnbet:'ESPN BET',espn:'ESPN BET',hardrock:'Hard Rock'",1)
          old="function americanImplied(price){const p=finite(price);if(p===null||p===0)return null;return p>0?100/(p+100):(-p)/((-p)+100);}\n"
          new="""function americanImplied(price){const p=finite(price);if(p===null||p===0)return null;return p>0?100/(p+100):(-p)/((-p)+100);}
          function explicitSlipOffer(leg){
            const oddsAmerican=finite(leg?.oddsAmerican),sportsbook=normBook(leg?.sportsbook);
            if(oddsAmerican===null||oddsAmerican===0||Math.abs(oddsAmerican)<100||!sportsbook)return null;
            return {sportsbook,oddsAmerican:Math.round(oddsAmerican),selectionLink:null,selectionId:null,betslipUrl:null,snapshotTime:null,priceKind:'explicit-slip',preserved:false,line:finite(leg?.line),side:quoteSide(leg)};
          }
          """
          if old not in s: raise SystemExit('adapter explicit offer anchor not found')
          s=s.replace(old,new,1)
          old="""function quoteProbabilitySafe(odds,leg,row){
            const side=quoteSide(leg);
            const rows=matchingQuoteRows(odds,leg,row);
            const probabilities=rows.map(r=>sideProbability(r,side)).filter(Number.isFinite);
            if(!probabilities.length)return {probability:null,method:null};
            const twoSided=rows.some(r=>(finite(r?.overImplied)??americanImplied(r?.overPrice))!==null&&(finite(r?.underImplied)??americanImplied(r?.underPrice))!==null);
            return {probability:clamp(median(probabilities)),method:twoSided?'sportsbook-devig-median':'sportsbook-implied-median'};
          }
          """.replace('            ','  ')
          new="""function quoteProbabilitySafe(odds,leg,row){
            const side=quoteSide(leg);
            const rows=matchingQuoteRows(odds,leg,row);
            const probabilities=rows.map(r=>sideProbability(r,side)).filter(Number.isFinite);
            if(probabilities.length){
              const twoSided=rows.some(r=>(finite(r?.overImplied)??americanImplied(r?.overPrice))!==null&&(finite(r?.underImplied)??americanImplied(r?.underPrice))!==null);
              return {probability:clamp(median(probabilities)),method:twoSided?'sportsbook-devig-median':'sportsbook-implied-median'};
            }
            const slip=explicitSlipOffer(leg);
            const implied=americanImplied(slip?.oddsAmerican);
            return Number.isFinite(implied)?{probability:clamp(implied),method:'sportsbook-slip-implied'}:{probability:null,method:null};
          }
          """.replace('            ','  ')
          if old not in s: raise SystemExit('quoteProbabilitySafe anchor not found')
          s=s.replace(old,new,1)
          old="""    const offer={
                  oddsAmerican:price,
                  selectionLink:selectionLink||null,
                  betslipUrl:null,
                  selectionId:selectionId?String(selectionId):null,
                  snapshotTime:candidate?.snapshotTime||null,
                  line:finite(candidate?.line),
                  market:candidate?.market||leg.market||null,
                  marketKey:candidate?.marketKey||null,
                  bookKey:candidate?.bookKey||null
                };
          """.replace('                  ','    ')
          new="""    const offer={
                  oddsAmerican:price,
                  selectionLink:selectionLink||null,
                  betslipUrl:candidate?.betslipUrl||null,
                  selectionId:selectionId?String(selectionId):null,
                  snapshotTime:candidate?.snapshotTime||null,
                  priceKind:candidate?.priceKind||(candidate?.preserved?'last-verified-pregame':'verified-snapshot'),
                  preserved:Boolean(candidate?.preserved),
                  line:finite(candidate?.line),
                  market:candidate?.market||leg.market||null,
                  marketKey:candidate?.marketKey||null,
                  bookKey:candidate?.bookKey||null
                };
          """.replace('                  ','    ')
          if old not in s: raise SystemExit('sportsbook offer anchor not found')
          s=s.replace(old,new,1)
          old="""  const ranked=Object.entries(bookOffers).sort((a,b)=>b[1].oddsAmerican-a[1].oddsAmerican);
            const [sportsbook,best]=ranked[0]||[];
            return {bookOffers,preferred:best?{sportsbook,oddsAmerican:best.oddsAmerican,sportsbookLink:best.selectionLink||null,snapshotTime:best.snapshotTime||null}:null};
          """.replace('            ','  ')
          new="""  const slip=explicitSlipOffer(leg);
            if(slip&&!bookOffers[slip.sportsbook])bookOffers[slip.sportsbook]={...slip};
            const ranked=Object.entries(bookOffers).sort((a,b)=>b[1].oddsAmerican-a[1].oddsAmerican);
            const [sportsbook,best]=ranked[0]||[];
            return {bookOffers,preferred:best?{sportsbook,...best,sportsbookLink:best.selectionLink||null}:null};
          """.replace('            ','  ')
          if old not in s: raise SystemExit('sportsbook preferred anchor not found')
          s=s.replace(old,new,1)
          old="""    oddsAmerican:prices.preferred?.oddsAmerican??null,
                sportsbook:prices.preferred?.sportsbook??null,
                sportsbookLink:prices.preferred?.sportsbookLink??null,
                oddsSnapshotTime:prices.preferred?.snapshotTime??null,
                bookOffers:prices.bookOffers,
          """.replace('                ','    ')
          new="""    oddsAmerican:prices.preferred?.oddsAmerican??null,
                sportsbook:prices.preferred?.sportsbook??null,
                sportsbookLink:prices.preferred?.sportsbookLink??null,
                sportsbookSelectionId:prices.preferred?.selectionId??null,
                oddsSnapshotTime:prices.preferred?.snapshotTime??null,
                oddsPriceKind:prices.preferred?.priceKind??null,
                oddsPreserved:Boolean(prices.preferred?.preserved),
                bookOffers:prices.bookOffers,
          """.replace('                ','    ')
          if old not in s: raise SystemExit('pregame result anchor not found')
          s=s.replace(old,new,1)
          old="""      const live=await withEspnServerFetch(()=>legacy.analyzeBasketballSlip(sport,liveInputs,options));
                results.push(...(live.results||[]));
          """.replace('                ','      ')
          new="""      const live=await withEspnServerFetch(()=>legacy.analyzeBasketballSlip(sport,liveInputs,options));
                for(const liveResult of live.results||[]){
                  const sourceLeg=liveLegs.find(leg=>normPlayerName(leg.player)===normPlayerName(liveResult.player)&&leg.market===liveResult.market&&finite(leg.line)===finite(liveResult.line))||liveResult;
                  const row=closestEventRow(odds,sourceLeg,referenceTime);
                  const prices=sportsbookQuotesSafe(odds,sourceLeg,row);
                  const preferred=prices.preferred;
                  results.push({
                    ...liveResult,
                    bookOffers:{...(liveResult.bookOffers||{}),...prices.bookOffers},
                    ...(preferred&&finite(liveResult.oddsAmerican)===null?{
                      oddsAmerican:preferred.oddsAmerican,
                      sportsbook:preferred.sportsbook,
                      sportsbookLink:preferred.sportsbookLink||null,
                      sportsbookSelectionId:preferred.selectionId||null,
                      oddsSnapshotTime:preferred.snapshotTime||null,
                      oddsPriceKind:preferred.priceKind||null,
                      oddsPreserved:Boolean(preferred.preserved)
                    }:{})
                  });
                }
          """.replace('                ','      ')
          if old not in s: raise SystemExit('live result price merge anchor not found')
          s=s.replace(old,new,1)
          if 'explicitSlipOffer' not in s.split('module.exports=',1)[-1]:
            s=s.replace('module.exports={analyzeBasketballSlip,','module.exports={analyzeBasketballSlip,explicitSlipOffer,',1)
          p.write_text(s)

          # 4) Regression coverage.
          t=Path('tests/wnba-explicit-slip-price.test.js')
          t.write_text(r"""const test=require('node:test');
          const assert=require('node:assert/strict');
          const {parseSlip,sanitizeLeg}=require('../server/api/lib/slip-parser');
          const {normalizeUniversalLeg}=require('../server/api/lib/sport-router');
          const {pregameResult,sportsbookQuotesSafe}=require('../lib/basketball-adapter');

          test('sanitizeLeg preserves only valid explicit American odds and sportsbook',()=>{
            const leg=sanitizeLeg({sport:'WNBA',player:'Breanna Stewart',market:'pra',side:'over',line:30,inclusive:true,originalText:'Breanna Stewart 30+ PRA +125',oddsAmerican:125,sportsbook:'FanDuel'});
            assert.equal(leg.oddsAmerican,125);
            assert.equal(leg.sportsbook,'FanDuel');
            const invalid=sanitizeLeg({sport:'WNBA',player:'Breanna Stewart',market:'pra',side:'over',line:30,inclusive:true,oddsAmerican:50,sportsbook:'FanDuel'});
            assert.equal(invalid.oddsAmerican,null);
          });

          test('vision schema requests exact per-leg sportsbook price metadata and keeps it',async()=>{
            const oldKey=process.env.OPENAI_API_KEY;
            const oldFetch=global.fetch;
            process.env.OPENAI_API_KEY='test-key';
            let sawOddsSchema=false;
            global.fetch=async(_url,init)=>{
              const body=JSON.parse(init.body);
              const props=body?.text?.format?.schema?.properties?.legs?.items?.properties||{};
              sawOddsSchema=Boolean(props.oddsAmerican&&props.sportsbook);
              return {ok:true,status:200,json:async()=>({output_text:JSON.stringify({legs:[{sport:'WNBA',player:'Breanna Stewart',team:'NYL',market:'pra',side:'over',line:30,inclusive:true,originalText:'Breanna Stewart 30+ PRA +125',oddsAmerican:125,sportsbook:'FanDuel'}]})})};
            };
            try{
              const parsed=await parseSlip({mediaUrls:['https://example.com/slip.png']});
              assert.equal(sawOddsSchema,true);
              assert.equal(parsed.legs[0].oddsAmerican,125);
              assert.equal(parsed.legs[0].sportsbook,'FanDuel');
            }finally{
              global.fetch=oldFetch;
              if(oldKey===undefined)delete process.env.OPENAI_API_KEY;else process.env.OPENAI_API_KEY=oldKey;
            }
          });

          test('multi-sport normalization carries explicit slip quote metadata',()=>{
            const leg=normalizeUniversalLeg({sport:'WNBA',player:'Angel Reese',market:'rebsAsts',side:'over',line:12,inclusive:true,oddsAmerican:-105,sportsbook:'DraftKings Sportsbook'},0);
            assert.equal(leg.oddsAmerican,-105);
            assert.equal(leg.sportsbook,'DraftKings Sportsbook');
          });

          test('WNBA exact slip price fills a combo milestone missing from provider quotes',()=>{
            const leg={id:'stewart-pra',sport:'WNBA',player:'Breanna Stewart',team:'NYL',market:'pra',side:'over',line:30,inclusive:true,oddsAmerican:125,sportsbook:'FanDuel'};
            const eventRow={eventId:'wnba-1',sport:'WNBA',commenceTime:'2026-09-24T01:00:00.000Z',awayTeam:'Chicago Sky',homeTeam:'New York Liberty',player:'Breanna Stewart',team:'NYL',market:'points',line:20.5,book:'FanDuel',overPrice:-110,underPrice:-110};
            const odds={rows:[eventRow]};
            const result=pregameResult(odds,leg,eventRow);
            assert.equal(result.oddsAmerican,125);
            assert.equal(result.sportsbook,'FanDuel');
            assert.equal(result.oddsPriceKind,'explicit-slip');
            assert.equal(result.bookOffers.FanDuel.oddsAmerican,125);
            assert.equal(result.bookOffers.FanDuel.priceKind,'explicit-slip');
            assert.equal(result.probabilityMethod,'sportsbook-slip-implied');
            assert.ok(Math.abs(result.probability-(100/225))<1e-9);
          });

          test('fresh exact provider quote wins over older screenshot price for same sportsbook',()=>{
            const leg={sport:'WNBA',player:'Jordin Canada',market:'assists',side:'over',line:6,inclusive:true,oddsAmerican:140,sportsbook:'DraftKings'};
            const exact={eventId:'wnba-2',commenceTime:'2026-09-24T01:00:00.000Z',player:'Jordin Canada',market:'assists',line:5.5,book:'DraftKings',overPrice:115,underPrice:-145};
            const offers=sportsbookQuotesSafe({rows:[exact]},leg,exact);
            assert.equal(offers.bookOffers.DraftKings.oddsAmerican,115);
            assert.notEqual(offers.bookOffers.DraftKings.priceKind,'explicit-slip');
          });
          """)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete regression suite
        run: npm test
      - name: Commit tested staging changes and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wnba-explicit-slip-price-stage.yml
          git add server/api/lib/slip-parser.js server/api/lib/sport-router.js lib/basketball-adapter.js tests/wnba-explicit-slip-price.test.js
          git commit -m 'Preserve exact slip-bound WNBA prices'
          git pull --rebase origin wnba-parity-final-stage
          git push origin HEAD:wnba-parity-final-stage
