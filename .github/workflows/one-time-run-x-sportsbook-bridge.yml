name: Run X sportsbook bridge patch

on:
  push:
    paths:
      - 'scripts/apply-x-sportsbook-bridge.mjs'
      - '.github/workflows/one-time-run-x-sportsbook-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply patch
        run: node scripts/apply-x-sportsbook-bridge.mjs
      - name: Run tests
        run: npm test
      - name: Commit changes
        run: |
          git config user.name "parlayping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/api/x-worker.js builder-acceptance-final.js tests/x-mention-sportsbook-bridge.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Attach sportsbook prices to X mention builds"
          git push origin main
