name: Run X sportsbook bridge patch

on:
  push:
    paths:
      - 'scripts/apply-x-sportsbook-bridge.mjs'
      - 'scripts/apply-firsttd-share-compat.mjs'
      - '.github/workflows/one-time-run-x-sportsbook-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply patches
        run: |
          node scripts/apply-x-sportsbook-bridge.mjs
          node scripts/apply-firsttd-share-compat.mjs
      - name: Run tests
        run: npm test
      - name: Commit changes
        run: |
          git config user.name "parlayping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/api/x-worker.js server/api/lib/share-slip.js builder-acceptance-final.js tests/x-mention-sportsbook-bridge.test.js tests/firsttd-share-compat.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Upgrade legacy First TD share links"
          git push origin main
