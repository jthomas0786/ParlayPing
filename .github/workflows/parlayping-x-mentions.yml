name: ParlayPing X Mention Manual Fallback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parlayping-x-mentions
  cancel-in-progress: false

jobs:
  check-mentions:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check configuration
        id: config
        env:
          WORKER_SECRET: ${{ secrets.PARLAYPING_WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PARLAYPING_WORKER_SECRET is not configured. Mention worker remains inactive."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe @ParlayPing auth manually
        if: steps.config.outputs.configured == 'true'
        env:
          WORKER_SECRET: ${{ secrets.PARLAYPING_WORKER_SECRET }}
          WORKER_URL: https://parlayping.net/api/x-worker?probe=auth
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --max-time 60 \
            -H "x-parlayping-secret: $WORKER_SECRET" \
            "$WORKER_URL")"
          echo "$response"
          RESPONSE="$response" node - <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE || '{}');
          if (payload.ok !== true || payload.probeOnly !== true || payload.postingActive !== false) {
            throw new Error(`ParlayPing auth probe returned an unsafe response: ${JSON.stringify(payload)}`);
          }
          if (String(payload.username || '').toLowerCase() !== 'parlayping') {
            throw new Error(`ParlayPing auth probe resolved unexpected account: ${payload.username || 'unknown'}`);
          }
          console.log('Protected @ParlayPing auth probe passed; this workflow cannot post.');
          NODE
