name: ParlayPing X Mention Check

on:
  schedule:
    # GitHub documents that scheduled workflows may be delayed/dropped under load,
    # especially around the start of the hour. Keep this as a serialized fallback,
    # offset from the common :00/:05 boundaries.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parlayping-x-mentions
  cancel-in-progress: false

jobs:
  check-mentions:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check configuration
        id: config
        env:
          WORKER_SECRET: ${{ secrets.PARLAYPING_WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PARLAYPING_WORKER_SECRET is not configured. Mention worker remains inactive."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Poll @ParlayPing mentions
        if: steps.config.outputs.configured == 'true'
        env:
          WORKER_SECRET: ${{ secrets.PARLAYPING_WORKER_SECRET }}
          WORKER_URL: https://parlayping.net/api/x-worker
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --max-time 60 \
            -H "x-parlayping-secret: $WORKER_SECRET" \
            "$WORKER_URL")"
          echo "$response"
          RESPONSE="$response" node - <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE || '{}');
          if (payload.ok !== true) {
            throw new Error(`ParlayPing worker returned non-ok response: ${JSON.stringify(payload)}`);
          }
          if (payload.active === false) {
            console.log(`Worker reachable and safely idle: ${payload.reason || 'inactive'}`);
          } else {
            console.log(`Worker reachable and active; processed ${Number(payload.processed || 0)} candidate(s).`);
          }
          NODE
