name: Production FanDuel resolver smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-fanduel-resolver.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query production FanDuel resolver with benchmark slip
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/body.json <<'JSON'
          {
            "book":"FanDuel",
            "legs":[
              {"sport":"NFL","player":"Patrick Mahomes","matchup":"KC @ MIA","market":"passYds","side":"over","line":225,"inclusive":true,"startTimeUTC":"2026-09-27T17:00:00Z"},
              {"sport":"NFL","player":"Rashee Rice","matchup":"KC @ MIA","market":"recYds","side":"over","line":30,"inclusive":true,"startTimeUTC":"2026-09-27T17:00:00Z"},
              {"sport":"NFL","player":"Kenneth Walker III","matchup":"KC @ MIA","market":"rushYds","side":"over","line":70,"inclusive":true,"startTimeUTC":"2026-09-27T17:00:00Z"},
              {"sport":"NFL","player":"Jaxon Smith-Njigba","matchup":"SEA @ WAS","market":"recYds","side":"over","line":80,"inclusive":true,"startTimeUTC":"2026-09-27T17:00:00Z"},
              {"sport":"NFL","player":"Sam Darnold","matchup":"SEA @ WAS","market":"passYds","side":"over","line":175,"inclusive":true,"startTimeUTC":"2026-09-27T17:00:00Z"},
              {"sport":"NFL","player":"Stefon Diggs","matchup":"SEA @ WAS","market":"recYds","side":"over","line":20,"inclusive":true,"startTimeUTC":"2026-09-27T17:00:00Z"}
            ]
          }
          JSON

          curl -fsS -X POST \
            -H 'content-type: application/json' \
            --data-binary @/tmp/body.json \
            https://www.parlayping.net/api/sportsbook-link \
            -o /tmp/result.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          assert d.get('ok') is True, d
          diag=d.get('diagnostics') or {}
          assert diag.get('book') == 'FanDuel', d
          assert diag.get('totalLegs') == 6, d
          assert isinstance(diag.get('legs'),list) and len(diag['legs']) == 6, d
          print(json.dumps({
              'exact':d.get('exact'),
              'prefilled':d.get('prefilled'),
              'diagnostic_code':diag.get('code'),
              'exact_coverage':diag.get('exactCoverage'),
              'priced_coverage':diag.get('pricedCoverage'),
              'provider_reference_coverage':diag.get('providerReferenceCoverage'),
              'legs':diag.get('legs'),
          },indent=2))
          PY
