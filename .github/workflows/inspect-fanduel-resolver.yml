name: Production FanDuel Builder smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-fanduel-resolver.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build and inspect production six-leg FanDuel slip
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/create.json <<'JSON'
          {
            "text":"Patrick Mahomes 225+ PASS YDS\nRashee Rice 30+ REC YDS\nKenneth Walker III 70+ RUSH YDS\nJaxon Smith-Njigba 80+ REC YDS\nSam Darnold 175+ PASS YDS\nStefon Diggs 20+ REC YDS"
          }
          JSON

          curl -fsS -X POST \
            -H 'content-type: application/json' \
            --data-binary @/tmp/create.json \
            https://www.parlayping.net/api/landing-create \
            -o /tmp/create-result.json

          BUILDER_URL="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/create-result.json'))
          assert d.get('ok') is True, d
          assert d.get('legCount') == 6, d
          url=d.get('builderUrl')
          assert isinstance(url,str) and url.startswith('https://'), d
          print(url)
          PY
          )"

          curl -fsS "$BUILDER_URL" -o /tmp/builder.html

          python3 - <<'PY'
          import json,re
          html=open('/tmp/builder.html',encoding='utf-8').read()
          m=re.search(r'window\.__PARLAYPING_BUILDER__=(.*?);</script>',html,re.S)
          assert m, 'Builder payload not found'
          payload=json.loads(m.group(1))
          slip=payload.get('slip') or {}
          legs=slip.get('legs') or []
          assert len(legs)==6, f'Expected 6 Builder legs, got {len(legs)}'

          def offer_for(leg,wanted):
              for book,offer in (leg.get('bookOffers') or {}).items():
                  if ''.join(c for c in str(book).lower() if c.isalnum()) == wanted:
                      return offer or {}
              return None

          rows=[]
          all_priced=True
          for i,leg in enumerate(legs):
              offer=offer_for(leg,'fanduel')
              odds=None if offer is None else offer.get('oddsAmerican')
              priced=isinstance(odds,(int,float)) and odds != 0
              all_priced=all_priced and priced
              rows.append({
                  'index':i,
                  'player':leg.get('player'),
                  'market':leg.get('market'),
                  'line':leg.get('line'),
                  'inclusive':leg.get('inclusive'),
                  'fanduel_price':odds,
                  'matched_line':None if offer is None else offer.get('matchedLine'),
                  'has_selection_link':bool(offer and offer.get('selectionLink')),
                  'has_selection_id':bool(offer and offer.get('selectionId')),
                  'has_market_id':bool(offer and offer.get('marketId')),
                  'price_kind':None if offer is None else offer.get('priceKind'),
              })

          links=slip.get('sportsbookLinks') or {}
          fd_link=next((v for k,v in links.items() if ''.join(c for c in str(k).lower() if c.isalnum())=='fanduel'),None)
          print(json.dumps({
              'leg_count':len(legs),
              'all_fanduel_priced':all_priced,
              'has_fanduel_prefilled_url':bool(fd_link),
              'rows':rows,
          },indent=2))

          # This is the production contract: FanDuel only appears as full-slip coverage
          # when every exact leg carries a real, non-zero FanDuel price.
          assert all_priced, 'FanDuel does not currently have verified full-slip exact pricing in the rendered Builder'
          if fd_link:
              assert str(fd_link).startswith('https://'), 'FanDuel combined URL must be HTTPS'
              assert 'fanduel.com' in str(fd_link).lower(), 'FanDuel combined URL must target FanDuel'
          PY
