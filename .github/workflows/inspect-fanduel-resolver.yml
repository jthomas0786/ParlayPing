name: Production sportsbook and AI smoke

# Production smoke is intentionally triggered only by edits to this file after the target deploy is READY.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-fanduel-resolver.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify active exact sportsbook markets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request

          URL='https://www.parlayping.net/api/sportsbook-link'

          def post(book, legs):
              body=json.dumps({'book':book,'legs':legs}).encode()
              req=urllib.request.Request(URL,data=body,headers={'content-type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.load(r)

          base={'sport':'NFL','matchup':'PHI @ CHI','side':'over','inclusive':True,'startTimeUTC':'2026-09-29T00:15:00Z'}
          candidates=[
              ('Jalen Hurts','passYds',[175,200,225]),
              ('Caleb Williams','passYds',[175,200,225]),
              ('Saquon Barkley','rushYds',[40,50,60]),
              ('A.J. Brown','recYds',[30,40,50]),
              ('DeVonta Smith','recYds',[25,30,40]),
              ('Rome Odunze','recYds',[25,30,40]),
              ('DJ Moore','recYds',[25,30,40]),
              ('Cole Kmet','recYds',[15,20,25]),
          ]

          def probe(book, minimum=0):
              exact=[]
              attempts=[]
              for player,market,lines in candidates:
                  matched=None
                  for line in lines:
                      leg={**base,'player':player,'market':market,'line':line}
                      d=post(book,[leg])
                      sel=(d.get('selections') or [None])[0]
                      attempts.append({
                          'player':player,'market':market,'line':line,
                          'exact':bool(d.get('exact')),
                          'price':sel.get('price') if isinstance(sel,dict) else None,
                          'code':(d.get('diagnostics') or {}).get('code')
                      })
                      if d.get('exact') and isinstance(sel,dict) and isinstance(sel.get('price'),(int,float)) and sel.get('price')!=0:
                          matched=leg
                          break
                  if matched:
                      exact.append(matched)
              print(book.upper()+'_ATTEMPTS',json.dumps(attempts,separators=(',',':')))
              assert len(exact)>=minimum, f'Expected at least {minimum} active exact {book} selections; found {len(exact)}'
              if not exact:
                  print(book.upper()+'_COMBINED',json.dumps({'legs':0,'exact':False,'prefilled':False,'diagnostic':'NO_ACTIVE_EXACT_SELECTIONS'},separators=(',',':')))
                  return
              combined=post(book,exact)
              selections=combined.get('selections') or []
              assert combined.get('exact') is True, combined
              assert len(selections)==len(exact), combined
              assert all(isinstance(s,dict) and isinstance(s.get('price'),(int,float)) and s.get('price')!=0 for s in selections), combined
              print(book.upper()+'_COMBINED',json.dumps({
                  'legs':len(exact),'exact':combined.get('exact'),'prefilled':combined.get('prefilled'),
                  'diagnostic':(combined.get('diagnostics') or {}).get('code'),
                  'prices':[s.get('price') for s in selections],
                  'links':sum(1 for s in selections if isinstance(s,dict) and s.get('selectionLink'))
              },separators=(',',':')))

          probe('FanDuel',2)
          probe('BetMGM',1)
          probe('BetRivers')
          probe('Bovada')
          PY

      - name: Verify production OpenAI vision parsing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, urllib.request

          with urllib.request.urlopen(
              'https://raw.githubusercontent.com/jthomas0786/ParlayPing/main/parlayping-approved-logo.png',
              timeout=30,
          ) as image_response:
              png = base64.b64encode(image_response.read()).decode()

          payload={
              'text':'NFL\nJalen Hurts 175+ passing yards\nFanDuel',
              'imageData':'data:image/png;base64,'+png,
          }
          req=urllib.request.Request(
              'https://www.parlayping.net/api/landing-create',
              data=json.dumps(payload).encode(),
              headers={'content-type':'application/json','accept':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req,timeout=60) as response:
              data=json.load(response)
          print('VISION_SMOKE',json.dumps({
              'ok':data.get('ok'),'method':data.get('method'),'legCount':data.get('legCount'),
              'sport':data.get('sport'),'sportsbook':data.get('sportsbook'),
              'hasBuilderUrl':bool(data.get('builderUrl'))
          },separators=(',',':')))
          assert data.get('ok') is True, data
          assert data.get('method') == 'vision', data
          assert int(data.get('legCount') or 0) >= 1, data
          PY

      - name: Verify BetMGM reaches rendered Builder state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request

          text='''NFL
          Jalen Hurts 200+ passing yards
          Saquon Barkley 50+ rushing yards
          DeVonta Smith 25+ receiving yards
          Rome Odunze 25+ receiving yards
          BetMGM'''
          req=urllib.request.Request(
              'https://www.parlayping.net/api/landing-create',
              data=json.dumps({'text':text}).encode(),
              headers={'content-type':'application/json','accept':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req,timeout=60) as response:
              created=json.load(response)
          assert created.get('ok') is True, created
          assert created.get('legCount') == 4, created
          url=created.get('builderUrl')
          assert url, created
          with urllib.request.urlopen(url,timeout=90) as response:
              html=response.read().decode('utf-8')
          match=re.search(r'window\.__PARLAYPING_BUILDER__=(\{.*?\});</script>',html,re.S)
          assert match, 'Builder state payload not found'
          state=json.loads(match.group(1))
          legs=(state.get('slip') or {}).get('legs') or []
          assert len(legs)==4, state
          prices=[]
          links=[]
          for leg in legs:
              offer=((leg.get('bookOffers') or {}).get('BetMGM') or {})
              price=offer.get('oddsAmerican')
              assert isinstance(price,(int,float)) and price!=0, {'leg':leg.get('player'),'offer':offer}
              prices.append(price)
              links.append(bool(offer.get('selectionLink')))
          print('BETMGM_BUILDER',json.dumps({
              'legs':len(legs),'prices':prices,'selectionLinks':sum(1 for value in links if value),
              'combinedLink':bool(((state.get('slip') or {}).get('sportsbookLinks') or {}).get('BetMGM'))
          },separators=(',',':')))
          PY
