name: Production sportsbook and AI smoke

# Intentionally manual-by-edit: this smoke hits production after a target deploy is READY.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-fanduel-resolver.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify batched sportsbook Builder path without quota-hungry discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, time, urllib.error, urllib.request

          BASE='https://www.parlayping.net'
          text='''NFL
          Jalen Hurts 175+ passing yards
          Saquon Barkley 50+ rushing yards
          DeVonta Smith 40+ receiving yards
          Rome Odunze 30+ receiving yards
          Cole Kmet 20+ receiving yards'''

          create=urllib.request.Request(
              BASE+'/api/landing-create',
              data=json.dumps({'text':text}).encode(),
              headers={'content-type':'application/json','accept':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(create,timeout=60) as response:
              created=json.load(response)
          assert created.get('ok') is True, created
          assert created.get('legCount') == 5, created
          builder_url=created.get('builderUrl')
          assert builder_url, created

          started=time.monotonic()
          with urllib.request.urlopen(builder_url,timeout=90) as response:
              assert response.status == 200
              html=response.read().decode('utf-8')
          elapsed=time.monotonic()-started
          assert elapsed < 30, f'Builder took {elapsed:.2f}s'

          match=re.search(r'window\.__PARLAYPING_BUILDER__=(\{.*?\});</script>',html,re.S)
          assert match, 'Builder state payload not found'
          state=json.loads(match.group(1))
          slip=state.get('slip') or {}
          legs=slip.get('legs') or []
          assert len(legs)==5, state

          books=['FanDuel','DraftKings','BetMGM','BetRivers','Bovada','theScore Bet']
          exact_books=[]
          priced_books=[]
          for book in books:
              offers=[((leg.get('bookOffers') or {}).get(book) or {}) for leg in legs]
              prices=[offer.get('oddsAmerican') for offer in offers]
              assert all(price != 0 for price in prices), {'book':book,'prices':prices}
              if all(isinstance(price,(int,float)) and price != 0 for price in prices):
                  priced_books.append(book)
              if all(offer.get('priceKind')=='verified-exact-resolver' and isinstance(offer.get('oddsAmerican'),(int,float)) and offer.get('oddsAmerican')!=0 for offer in offers):
                  exact_books.append(book)

          print('BUILDER_BATCH_SMOKE',json.dumps({
              'elapsedSeconds':round(elapsed,3),
              'legs':len(legs),
              'pricedBooks':priced_books,
              'exactResolverBooks':exact_books,
          },separators=(',',':')))

          # If the batch could not enrich any book, make only one low-cost probe to
          # distinguish external Odds API quota exhaustion from an application failure.
          if not exact_books:
              leg={
                  'sport':'NFL','matchup':'PHI @ CHI','player':'Jalen Hurts',
                  'market':'passYds','side':'over','line':175,'inclusive':True,
                  'startTimeUTC':'2026-09-29T00:15:00Z'
              }
              req=urllib.request.Request(
                  BASE+'/api/sportsbook-link',
                  data=json.dumps({'book':'FanDuel','legs':[leg]}).encode(),
                  headers={'content-type':'application/json','accept':'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req,timeout=45) as response:
                      probe=json.load(response)
                  assert probe.get('ok') is True, probe
                  print('ODDS_PROVIDER_PROBE',json.dumps({
                      'status':'available','exact':probe.get('exact'),
                      'diagnostic':(probe.get('diagnostics') or {}).get('code')
                  },separators=(',',':')))
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode('utf-8','replace')
                  low=body.lower()
                  if exc.code == 401 and ('credit' in low or 'usage' in low):
                      print('ODDS_PROVIDER_PROBE',json.dumps({
                          'status':'quota-exhausted','httpStatus':exc.code
                      },separators=(',',':')))
                  else:
                      raise AssertionError(f'Unexpected sportsbook-link failure {exc.code}: {body}')
          PY

      - name: Verify production OpenAI vision parsing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, urllib.request

          with urllib.request.urlopen(
              'https://raw.githubusercontent.com/jthomas0786/ParlayPing/main/parlayping-approved-logo.png',
              timeout=30,
          ) as image_response:
              png = base64.b64encode(image_response.read()).decode()

          payload={
              'text':'NFL\nJalen Hurts 175+ passing yards\nFanDuel',
              'imageData':'data:image/png;base64,'+png,
          }
          req=urllib.request.Request(
              'https://www.parlayping.net/api/landing-create',
              data=json.dumps(payload).encode(),
              headers={'content-type':'application/json','accept':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req,timeout=60) as response:
              data=json.load(response)
          print('VISION_SMOKE',json.dumps({
              'ok':data.get('ok'),'method':data.get('method'),'legCount':data.get('legCount'),
              'sport':data.get('sport'),'sportsbook':data.get('sportsbook'),
              'hasBuilderUrl':bool(data.get('builderUrl'))
          },separators=(',',':')))
          assert data.get('ok') is True, data
          assert data.get('method') == 'vision', data
          assert int(data.get('legCount') or 0) >= 1, data
          PY
