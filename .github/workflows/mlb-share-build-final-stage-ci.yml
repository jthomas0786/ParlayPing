name: MLB Share Build Final Stage CI

on:
  push:
    branches: [mlb-share-build-hotfix-stage]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run full ParlayPing regression suite
        run: npm test
      - name: Verify exact four-player MLB odds against staged Sports Outpost feed
        env:
          SPORTS_OUTPOST_BASE_URL: https://raw.githubusercontent.com/jthomas0786/The-Sports-Outpost/mlb-parlayapi-odds-stage
        run: |
          node <<'NODE'
          const {enrichSportsbookMarkets}=require('./server/api/lib/sportsbook-enrich');
          (async()=>{
            const legs=[
              {id:'riley',sport:'MLB',player:'Riley Greene',team:'DET',gameId:'824223',matchup:'WSH @ DET',startTimeUTC:'2026-09-23T17:10:00Z',market:'homeRun',side:'yes',line:null,status:'LIVE'},
              {id:'mayo',sport:'MLB',player:'Coby Mayo',team:'BAL',matchup:'BAL @ TOR',startTimeUTC:'2026-09-23T17:35:00Z',market:'homeRun',side:'yes',line:null,status:'LIVE'},
              {id:'bell',sport:'MLB',player:'Josh Bell',team:'MIN',gameId:'823168',matchup:'MIN @ SF',startTimeUTC:'2026-09-23T19:45:00Z',market:'homeRun',side:'yes',line:null,status:'PENDING'},
              {id:'burger',sport:'MLB',player:'Jake Burger',team:'TEX',gameId:'822841',matchup:'TEX @ NYM',startTimeUTC:'2026-09-24T00:05:00Z',market:'homeRun',side:'yes',line:null,status:'PENDING'},
            ];
            const out=await enrichSportsbookMarkets({legs});
            for(const leg of out.legs){
              const offers=leg.bookOffers||{};
              const verified=Object.entries(offers).filter(([,offer])=>Number.isFinite(Number(offer?.oddsAmerican)));
              console.log(JSON.stringify({player:leg.player,preferred:{book:leg.sportsbook,odds:leg.oddsAmerican},books:verified.map(([book])=>book)}));
              if(!Number.isFinite(Number(leg.oddsAmerican)))throw new Error(`${leg.player}: preferred sportsbook odds missing`);
              if(!leg.sportsbook)throw new Error(`${leg.player}: preferred sportsbook name missing`);
              if(!verified.length)throw new Error(`${leg.player}: no verified sportsbook price`);
            }
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Verify exact four-player MLB headshots resolve to trusted image sources
        run: |
          node <<'NODE'
          const {withAssets}=require('./server/api/lib/share-hydrate');
          const {isTrustedImageUrl}=require('./server/api/lib/headshot-ensure');
          (async()=>{
            const slip={legs:[
              {sport:'MLB',player:'Riley Greene',team:'DET',gameId:'824223',startTimeUTC:'2026-09-23T17:10:00Z'},
              {sport:'MLB',player:'Coby Mayo',team:'BAL',startTimeUTC:'2026-09-23T17:35:00Z'},
              {sport:'MLB',player:'Josh Bell',team:'MIN',gameId:'823168',startTimeUTC:'2026-09-23T19:45:00Z'},
              {sport:'MLB',player:'Jake Burger',team:'TEX',gameId:'822841',startTimeUTC:'2026-09-24T00:05:00Z'},
            ]};
            const out=await withAssets(slip);
            for(const leg of out.legs){
              console.log(JSON.stringify({player:leg.player,hasHeadshot:Boolean(leg.playerImageUrl),host:leg.playerImageUrl?new URL(leg.playerImageUrl).hostname:null}));
              if(!leg.playerImageUrl||!isTrustedImageUrl(leg.playerImageUrl))throw new Error(`${leg.player}: trusted player headshot missing`);
            }
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
