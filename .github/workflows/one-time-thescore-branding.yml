name: One-time theScore Bet branding migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-thescore-branding.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Update aliases and regression expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old}')
              p.write_text(text.replace(old,new,1))

          edit('server/api/lib/sportsbook-enrich.js', "espnbet:'ESPN BET',espn:'ESPN BET'", "espnbet:'theScore Bet',espn:'theScore Bet'")
          edit('builder-sportsbook-open-final.js', "'BetMGM','Fanatics','ESPN BET','Hard Rock Bet'", "'BetMGM','Fanatics','Hard Rock Bet'")
          edit('builder-sportsbook-open-final.js', "espnbet:'ESPN BET',espn:'ESPN BET'", "espnbet:'theScore Bet',espn:'theScore Bet'")

          p=Path('tests/exact-sportsbook-enrich.test.js')
          text=p.read_text()
          text=text.replace("missing coverage is proactively checked for FanDuel DraftKings BetMGM BetRivers and Bovada", "missing coverage is proactively checked for FanDuel DraftKings BetMGM BetRivers Bovada and theScore Bet",1)
          text=text.replace("assert.deepEqual(calls,['FanDuel','DraftKings','BetMGM','BetRivers','Bovada']);", "assert.deepEqual(calls,['FanDuel','DraftKings','BetMGM','BetRivers','Bovada','theScore Bet']);",1)
          text=text.replace("  assert.equal(hasFullBookPricing(out,'Bovada'),true);\n});", "  assert.equal(hasFullBookPricing(out,'Bovada'),true);\n  assert.equal(hasFullBookPricing(out,'theScore Bet'),true);\n});",1)
          p.write_text(text)

          p=Path('tests/sportsbook-resolver-regression.test.js')
          text=p.read_text().replace("builder-sportsbook-open-final\\.js\\?v=20260927g", "builder-sportsbook-open-final\\.js\\?v=20260927h",1)
          p.write_text(text)

          p=Path('tests/odds-api-deeplink.test.js')
          text=p.read_text()
          text=text.replace("  composeFanDuel,\n  composeDraftKings\n}=require('../server/api/lib/odds-api-deeplink');", "  composeFanDuel,\n  composeDraftKings,\n  getEvents,\n  getEventOdds,\n  clearOddsApiCaches\n}=require('../server/api/lib/odds-api-deeplink');",1)
          text=text.replace("  assert.equal(bookKey('Bovada'),'bovada');", "  assert.equal(bookKey('Bovada'),'bovada');\n  assert.equal(bookKey('theScore Bet'),'espnbet');\n  assert.equal(bookKey('ESPN BET'),'espnbet');",1)
          marker="coalesces concurrent cold event and event-odds provider requests"
          if marker not in text:
              text += """\n\ntest('coalesces concurrent cold event and event-odds provider requests',async()=>{\n  clearOddsApiCaches();\n  let calls=0;\n  const fetchImpl=async url=>{\n    calls+=1;\n    await new Promise(resolve=>setTimeout(resolve,20));\n    const href=String(url);\n    const data=href.includes('/odds')?{bookmakers:[]}:[];\n    return {ok:true,status:200,json:async()=>data,headers:{get:()=>null}};\n  };\n  await Promise.all([\n    getEvents('NFL','test-key',fetchImpl),\n    getEvents('NFL','test-key',fetchImpl),\n    getEvents('NFL','test-key',fetchImpl)\n  ]);\n  assert.equal(calls,1);\n  await Promise.all([\n    getEventOdds({sport:'NFL',eventId:'event-1',book:'theScore Bet',markets:['player_pass_yds'],apiKey:'test-key',fetchImpl}),\n    getEventOdds({sport:'NFL',eventId:'event-1',book:'theScore Bet',markets:['player_pass_yds'],apiKey:'test-key',fetchImpl})\n  ]);\n  assert.equal(calls,2);\n  clearOddsApiCaches();\n});\n"""
          p.write_text(text)
          PY
      - name: Run regression tests
        run: npm test
      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-thescore-branding.yml
          git config user.name "jthomas0786"
          git config user.email "jthomas0786@gmail.com"
          git add -A
          git commit -m "Normalize theScore Bet and verify provider concurrency"
          git push origin main
