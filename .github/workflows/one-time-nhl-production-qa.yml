name: One-time NHL production QA

on:
  push:
    paths:
      - '.github/workflows/one-time-nhl-production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production and verify NHL adapter
        shell: bash
        run: |
          set -euo pipefail
          payload='{"referenceTime":"2026-09-19T23:15:00Z","legs":[{"sport":"NHL","player":"Zack Bolduc","team":"MTL","market":"shotsOnGoal","side":"over","line":3,"inclusive":true,"originalText":"Zack Bolduc 3+ Shots on Goal"},{"sport":"NHL","player":"Josh Anderson","team":"MTL","market":"points","side":"over","line":1,"inclusive":true,"originalText":"Josh Anderson 1+ Points"},{"sport":"NHL","player":"Brett Berard","team":"MTL","market":"anytimeGoal","side":"yes","line":null,"inclusive":true,"originalText":"Brett Berard Anytime Goal Scorer"}]}'
          ok=0
          for attempt in $(seq 1 15); do
            echo "production probe attempt $attempt"
            if curl --silent --show-error --fail-with-body --location --post301 --post302 --post303 --max-time 30 \
              -X POST 'https://parlayping.net/api/analyze' \
              -H 'content-type: application/json' \
              --data "$payload" > /tmp/nhl.json; then
              cat /tmp/nhl.json
              if node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/nhl.json','utf8'));
          if(!d.ok) throw new Error('analysis not ok');
          if(!(d.sports||[]).includes('NHL')) throw new Error('NHL sport missing');
          if(!(d.supportedSports||[]).includes('NHL')) throw new Error('NHL adapter not supported');
          if((d.unsupportedSports||[]).includes('NHL')) throw new Error('NHL incorrectly unsupported');
          const rows=d.results||[];
          if(rows.length!==3) throw new Error(`wrong result count ${rows.length}`);
          const byName=Object.fromEntries(rows.map(r=>[r.player,r]));
          const bolduc=byName['Zack Bolduc'],anderson=byName['Josh Anderson'],berard=byName['Brett Berard'];
          for(const r of rows) if(String(r.gameId)!=='401881922') throw new Error(`wrong NHL game for ${r.player}: ${r.gameId}`);
          if(bolduc.status!=='HIT'||Number(bolduc.current)!==3) throw new Error(`Bolduc grading wrong: ${JSON.stringify(bolduc)}`);
          if(anderson.status!=='HIT'||Number(anderson.current)!==1) throw new Error(`Anderson grading wrong: ${JSON.stringify(anderson)}`);
          if(berard.status!=='MISS'||Number(berard.current)!==0) throw new Error(`Berard grading wrong: ${JSON.stringify(berard)}`);
          if(Number(d.counts?.hit)!==2||Number(d.counts?.miss)!==1||Number(d.counts?.unresolved)!==0) throw new Error(`wrong counts ${JSON.stringify(d.counts)}`);
          if(!String(d.source||'').includes('Sports Outpost NHL')) throw new Error('NHL source missing');
          if(!String(d.replyText||'').startsWith('🔔 ParlayPing Live')) throw new Error(`reply title wrong: ${d.replyText}`);
          console.log('NHL production adapter verified:', rows.map(r=>({player:r.player,status:r.status,current:r.current,gameId:r.gameId})));
          NODE
              then
                ok=1
                break
              fi
            fi
            sleep 8
          done
          test "$ok" -eq 1
