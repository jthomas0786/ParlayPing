name: MLB No-Reject Staging CI

on:
  push:
    branches: [mlb-no-reject-stage]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mlb:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full regression suite
        run: npm test
      - name: Verify official MLB source contract for reported players
        run: |
          node - <<'NODE'
          const names=['Riley Greene','Coby Mayo','Josh Bell','Jake Burger'];
          const playersResponse=await fetch('https://statsapi.mlb.com/api/v1/sports/1/players?season=2026&hydrate=currentTeam');
          if(!playersResponse.ok)throw new Error(`MLB player directory HTTP ${playersResponse.status}`);
          const players=await playersResponse.json();
          const resolved=[];
          for(const name of names){
            const player=(players.people||[]).find(p=>String(p.fullName||'').toLowerCase()===name.toLowerCase());
            if(!player)throw new Error(`Official MLB player directory did not resolve ${name}`);
            resolved.push({name,id:player.id,teamId:player.currentTeam?.id||null,team:player.currentTeam?.name||null});
          }
          const scheduleResponse=await fetch('https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=2026-09-23');
          if(!scheduleResponse.ok)throw new Error(`MLB schedule HTTP ${scheduleResponse.status}`);
          const schedule=await scheduleResponse.json();
          const teamIds=new Set((schedule.dates||[]).flatMap(d=>d.games||[]).flatMap(g=>[g.teams?.away?.team?.id,g.teams?.home?.team?.id]).filter(Boolean));
          for(const row of resolved){
            if(row.teamId&&!teamIds.has(row.teamId))throw new Error(`${row.name} resolved to ${row.team||row.teamId}, but that team was not found on the Sep 23 MLB schedule`);
          }
          console.log(JSON.stringify({ok:true,resolved},null,2));
          NODE
