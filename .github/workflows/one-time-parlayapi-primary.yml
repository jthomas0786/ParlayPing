name: One-time ParlayAPI primary pricing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-parlayapi-primary.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make ParlayAPI snapshot pricing authoritative
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old,new,count))

          # Tag exact Sports Outpost offers with their upstream pricing source.
          replace(
              'server/api/lib/sportsbook-enrich.js',
              "const offer={oddsAmerican:price,selectionLink:row.deepLink||row.selectionLink||null,betslipUrl:null,snapshotTime:row.snapshotTime||null,preserved:Boolean(row.preserved),priceKind:row.preserved?'last-verified-pregame':'verified-snapshot'};",
              "const offer={oddsAmerican:price,selectionLink:row.deepLink||row.selectionLink||null,betslipUrl:null,snapshotTime:row.snapshotTime||null,preserved:Boolean(row.preserved),priceKind:row.preserved?'last-verified-pregame':'verified-snapshot',priceSource:String(doc?.meta?.source||'').toLowerCase()==='parlayapi'?'ParlayAPI':'SportsOutpostSnapshot'};"
          )
          replace(
              'server/api/lib/sportsbook-enrich.js',
              "if(!existing||price>existing.oddsAmerican)bookOffers[book]={oddsAmerican:price,selectionLink,betslipUrl:null};",
              "if(!existing||price>existing.oddsAmerican)bookOffers[book]={oddsAmerican:price,selectionLink,betslipUrl:null,priceKind:'verified-snapshot',priceSource:String(doc?.meta?.source||'').toLowerCase()==='parlayapi'?'ParlayAPI':'SportsOutpostSnapshot'};"
          )
          replace(
              'server/api/lib/sportsbook-enrich.js',
              "if(!existing||price>existing.oddsAmerican)bookOffers[book]={oddsAmerican:price,selectionLink:offer?.link||offer?.deepLink||null,betslipUrl:null};",
              "if(!existing||price>existing.oddsAmerican)bookOffers[book]={oddsAmerican:price,selectionLink:offer?.link||offer?.deepLink||null,betslipUrl:null,priceKind:'verified-snapshot',priceSource:String(doc?.meta?.source||'').toLowerCase()==='parlayapi'?'ParlayAPI':'SportsOutpostSnapshot'};"
          )

          # If The Odds API is invoked for a partially-covered book, never replace
          # a valid ParlayAPI exact price. It may fill a missing price and/or attach
          # native sportsbook selection metadata to the ParlayAPI-priced leg.
          old="""    const existingOffers = leg?.bookOffers && typeof leg.bookOffers === 'object' ? leg.bookOffers : {};
    const existing = bookOffer(leg, book) || {};
    return {
      ...leg,
      bookOffers: {
        ...existingOffers,
        [book]: {
          ...existing,
          oddsAmerican: price,
          ...(selection.selectionLink ? { selectionLink: selection.selectionLink } : {}),
          ...(selection.selectionId ? { selectionId: String(selection.selectionId) } : {}),
          ...(selection.marketId ? { marketId: String(selection.marketId) } : {}),
          ...(selection.marketKey ? { marketKey: String(selection.marketKey) } : {}),
          ...(selection.line != null ? { matchedLine: Number(selection.line) } : {}),
          priceKind: 'verified-exact-resolver',
        },
      },
    };"""
          new="""    const existingOffers = leg?.bookOffers && typeof leg.bookOffers === 'object' ? leg.bookOffers : {};
    const existing = bookOffer(leg, book) || {};
    const existingPrice = finiteOdds(existing?.oddsAmerican);
    const preserveParlayApiPrice = existingPrice != null && String(existing?.priceSource || '') === 'ParlayAPI';
    const hasProviderReference = Boolean(selection.selectionLink || selection.selectionId || selection.marketId);
    return {
      ...leg,
      bookOffers: {
        ...existingOffers,
        [book]: {
          ...existing,
          oddsAmerican: preserveParlayApiPrice ? existingPrice : price,
          ...(selection.selectionLink ? { selectionLink: selection.selectionLink } : {}),
          ...(selection.selectionId ? { selectionId: String(selection.selectionId) } : {}),
          ...(selection.marketId ? { marketId: String(selection.marketId) } : {}),
          ...(selection.marketKey ? { marketKey: String(selection.marketKey) } : {}),
          ...(selection.line != null ? { matchedLine: Number(selection.line) } : {}),
          priceKind: preserveParlayApiPrice ? (existing.priceKind || 'verified-snapshot') : 'verified-exact-resolver',
          priceSource: preserveParlayApiPrice ? 'ParlayAPI' : 'TheOddsAPI',
          ...(hasProviderReference ? { referenceSource: 'TheOddsAPI' } : {}),
        },
      },
    };"""
          replace('server/api/lib/exact-sportsbook-enrich.js', old, new)

          p=Path('tests/exact-sportsbook-enrich.test.js')
          text=p.read_text()
          marker="ParlayAPI exact price remains authoritative when fallback adds selection metadata"
          if marker not in text:
              text += r'''

test('ParlayAPI exact price remains authoritative when fallback adds selection metadata',()=>{
  const slip={legs:[{
    sport:'NFL',player:'Jalen Hurts',market:'passYds',side:'over',line:175,inclusive:true,
    bookOffers:{FanDuel:{oddsAmerican:-410,priceKind:'verified-snapshot',priceSource:'ParlayAPI'}}
  }]};
  const result={
    exact:true,
    url:'https://account.sportsbook.fanduel.com/sportsbook/addToBetslip?marketId%5B0%5D=42.1&selectionId%5B0%5D=99',
    selections:[{
      price:-390,line:174.5,marketKey:'player_pass_yds_alternate',marketId:'42.1',selectionId:'99',
      selectionLink:'https://sportsbook.fanduel.com/addToBetslip?marketId=42.1&selectionId=99'
    }]
  };
  const out=applyExactResolution(slip,'FanDuel',result);
  const offer=out.legs[0].bookOffers.FanDuel;
  assert.equal(offer.oddsAmerican,-410);
  assert.equal(offer.priceSource,'ParlayAPI');
  assert.equal(offer.priceKind,'verified-snapshot');
  assert.equal(offer.selectionId,'99');
  assert.equal(offer.marketId,'42.1');
  assert.equal(offer.referenceSource,'TheOddsAPI');
  assert.ok(out.sportsbookLinks.FanDuel.includes('selectionId'));
});

test('fallback pricing is used only when ParlayAPI has no exact price for that leg',()=>{
  const slip={legs:[{
    sport:'NFL',player:'Jalen Hurts',market:'passYds',side:'over',line:175,inclusive:true,
    bookOffers:{FanDuel:{}}
  }]};
  const out=applyExactResolution(slip,'FanDuel',{
    exact:false,url:null,selections:[{price:-390,line:174.5,marketKey:'player_pass_yds_alternate'}]
  });
  const offer=out.legs[0].bookOffers.FanDuel;
  assert.equal(offer.oddsAmerican,-390);
  assert.equal(offer.priceSource,'TheOddsAPI');
  assert.equal(offer.priceKind,'verified-exact-resolver');
});
'''
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-parlayapi-primary.yml
          git config user.name "jthomas0786"
          git config user.email "jthomas0786@gmail.com"
          git add server/api/lib/sportsbook-enrich.js server/api/lib/exact-sportsbook-enrich.js tests/exact-sportsbook-enrich.test.js
          git add -u .github/workflows/one-time-parlayapi-primary.yml
          git commit -m "Keep ParlayAPI pricing authoritative in Builder"
          git push origin main
