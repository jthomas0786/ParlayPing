name: WNBA Production Smoke

on:
  push:
    branches: [wnba-parity-production-smoke]
    paths:
      - '.github/workflows/wnba-production-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live ParlayPing WNBA analysis
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/jthomas0786/The-Sports-Outpost/main/slates/wnba-odds.json' \
            -o /tmp/wnba.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/wnba.json','utf8'));
          const now=Date.now();
          const allowed=new Set(['points','rebounds','assists','threes']);
          const rows=(d.rows||[]).filter(r=>
            allowed.has(r.market) &&
            Number.isFinite(Number(r.line)) && Number(r.line)>0 &&
            Number.isFinite(Number(r.overPrice)) &&
            /[A-Za-z].*\s+[A-Za-z]/.test(String(r.player||'')) &&
            Date.parse(r.commenceTime||'') > now
          );
          if(!rows.length) throw new Error('No future priced WNBA player prop available for production smoke test.');
          rows.sort((a,b)=>Date.parse(a.commenceTime)-Date.parse(b.commenceTime));
          const r=rows[0];
          const payload={referenceTime:new Date().toISOString(),legs:[{
            sport:'WNBA',player:r.player,team:r.team||null,market:r.market,side:'over',line:Number(r.line),inclusive:false,
            originalText:`${r.player} Over ${r.line} ${r.market}`
          }]};
          fs.writeFileSync('/tmp/payload.json',JSON.stringify(payload));
          fs.writeFileSync('/tmp/selected.json',JSON.stringify({player:r.player,market:r.market,line:r.line,book:r.book,overPrice:r.overPrice,commenceTime:r.commenceTime,eventId:r.eventId},null,2));
          console.log('Selected:',fs.readFileSync('/tmp/selected.json','utf8'));
          NODE
          status=$(curl --silent --show-error --location --post301 --post302 --post303 \
            -X POST 'https://parlayping.net/api/analyze' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/payload.json \
            -o /tmp/result.json \
            -w '%{http_code}')
          echo "HTTP $status"
          cat /tmp/result.json
          echo
          test "$status" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const selected=JSON.parse(fs.readFileSync('/tmp/selected.json','utf8'));
          const result=JSON.parse(fs.readFileSync('/tmp/result.json','utf8'));
          if(result.ok!==true) throw new Error(`analysis not ok: ${JSON.stringify(result)}`);
          if(Number(result.counts?.unresolved)!==0) throw new Error(`unresolved: ${JSON.stringify(result.counts)}`);
          const row=(result.results||[])[0];
          if(!row||row.player!==selected.player||row.market!==selected.market||Number(row.line)!==Number(selected.line)) throw new Error(`wrong exact match: ${JSON.stringify(row)}`);
          if(!Number.isFinite(Number(row.oddsAmerican))) throw new Error(`missing exact sportsbook odds: ${JSON.stringify(row)}`);
          if(row.oddsPriceKind==='explicit-slip') throw new Error(`provider-backed smoke row incorrectly used slip fallback: ${JSON.stringify(row)}`);
          if(!row.bookOffers||!Object.keys(row.bookOffers).length) throw new Error(`missing sportsbook offers: ${JSON.stringify(row)}`);
          console.log('Production WNBA smoke passed:',JSON.stringify({player:row.player,market:row.market,line:row.line,oddsAmerican:row.oddsAmerican,sportsbook:row.sportsbook,oddsPriceKind:row.oddsPriceKind,books:Object.keys(row.bookOffers||{})},null,2));
          NODE
