name: MLB Share Build Hotfix CI

on:
  push:
    branches: [mlb-share-build-hotfix-stage]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run full regression suite
        run: npm test
      - name: Verify staged MLB ParlayAPI prices for reported slip
        env:
          SPORTS_OUTPOST_BASE_URL: https://raw.githubusercontent.com/jthomas0786/The-Sports-Outpost/mlb-parlayapi-odds-stage
        run: |
          node <<'NODE'
          const {loadSnapshot,parseRowSnapshot}=require('./server/api/lib/sportsbook-enrich');
          const toDecimal=price=>price>0?1+price/100:1+100/Math.abs(price);
          (async()=>{
            const doc=await loadSnapshot('MLB');
            if(!doc||doc?.meta?.source!=='parlayapi'||!Array.isArray(doc.rows)){
              throw new Error('Staged Sports Outpost MLB ParlayAPI snapshot unavailable');
            }
            const legs=[
              {sport:'MLB',player:'Riley Greene',team:'DET',gameId:'824223',market:'homeRun',side:'yes',line:null},
              {sport:'MLB',player:'Coby Mayo',team:'BAL',gameId:'729fa265c6b4b5b2',market:'homeRun',side:'yes',line:null},
              {sport:'MLB',player:'Josh Bell',team:'MIN',gameId:'823168',market:'homeRun',side:'yes',line:null},
              {sport:'MLB',player:'Jake Burger',team:'TEX',gameId:'822841',market:'homeRun',side:'yes',line:null},
            ];
            let bestEquivalentDecimal=1;
            for(const leg of legs){
              const parsed=parseRowSnapshot(doc,leg);
              const offers=parsed?.bookOffers||{};
              const priced=Object.entries(offers).filter(([,offer])=>Number.isFinite(Number(offer?.oddsAmerican)));
              const fakeLinks=priced.filter(([,offer])=>Boolean(offer?.selectionLink));
              console.log(JSON.stringify({player:leg.player,preferred:parsed?.preferred||null,books:priced.map(([book])=>book),selectionLinks:fakeLinks.length}));
              if(!parsed)throw new Error(`${leg.player}: staged MLB odds snapshot did not resolve sportsbook market`);
              if(!priced.length)throw new Error(`${leg.player}: no verified sportsbook HR price`);
              if(fakeLinks.length)throw new Error(`${leg.player}: staged ParlayAPI price unexpectedly claims an exact selection link`);
              const preferred=Number(parsed?.preferred?.oddsAmerican);
              if(!Number.isFinite(preferred))throw new Error(`${leg.player}: preferred verified price missing`);
              bestEquivalentDecimal*=toDecimal(preferred);
            }
            if(!(bestEquivalentDecimal>1))throw new Error('Best-available calculated parlay equivalent was not computable');
            console.log(`Verified all four MLB HR prices; best-available decimal equivalent=${bestEquivalentDecimal.toFixed(4)} (not a sportsbook-quoted parlay).`);
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
