name: Builder Visual Contract

on:
  pull_request:
    paths:
      - 'builder-template.html'
      - 'builder.css'
      - 'builder-precision.css'
      - 'builder-precision-runtime.js'
      - 'builder-concept-finish.js'
      - 'builder-mobile-fix.css'
      - 'builder-mobile-fix.js'
      - 'builder-mobile-final.css'
      - 'builder-mobile-final.js'
      - 'builder-acceptance-final.css'
      - 'builder-acceptance-final.js'
      - 'parlayping-approved-logo.png'
      - 'parlayping-approved-lockup.svg'
      - 'server/api/builder-page.js'
      - 'server/api/lib/share-assets.js'
      - 'server/api/lib/share-hydrate.js'
      - 'scripts/builder-visual-contract.mjs'
      - 'tests/builder-concept.test.js'
      - 'tests/final-acceptance.test.js'
      - '.github/workflows/builder-visual-contract.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify final desktop acceptance checklist
        run: node scripts/builder-visual-contract.mjs
      - name: Upload rendered desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-desktop-screenshots
          path: artifacts/builder-desktop-*.png
          if-no-files-found: error
          retention-days: 3
